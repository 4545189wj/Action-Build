name: Build All OnePlus Kernels
on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "配置文件//Configuration file"
        required: true
        default: oneplus_ace2_pro_b
        options:
          - oneplus_nord_n30_se_5g_v
          - oneplus_10r_v
          - oneplus_nord_3_b
          - oneplus_ace_v
          - oneplus_ace_race_v
          - oneplus_10_pro_b
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_pad_lite_b
          - oneplus_pad_mt6983_b
          - oneplus_ace_2v_b
          - oneplus_ace_pro_v
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_n6_b
          - oneplus_12_b
          - oneplus_pad_go_2_b
          - oneplus_turbo_6x_b
          - oneplus_nord_ce4_lite_5g_b
          - oneplus_nord_ce6_lite_b
          - oneplus_turbo_6v
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_pad_mt6897_b
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_ce5_b
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_b
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_race_b
          - oneplus_ace5_ultra_b
          - oneplus_pad2_mt6991_b
          - oneplus_ace_6
          - oneplus_turbo_6
          - oneplus_nord_6
          - oneplus_ace_6t
          - oneplus_15r
          - oneplus_15
          - oneplus_15t
          - oneplus_pad_3_pro
          - oneplus_pad_4
          - oneplus_ace6_ultra
      SUSFS_CI:
        type: choice
        description: "SUSFS模块下载调用方向//SUSFS module branch"
        required: true
        default: N/A
        options:
          - CI
          - Release
          - N/A
      KPM:
        type: choice
        description: "内核模块实现方式//Kernel module implementation method"
        required: true
        default: KPM
        options:
          - KPM
          - KPN
          - N/A
      SUSFS_META:
        type: string
        description: "回退SUSFS(输入哈希或次数或-1关闭)//Rollback SUSFS (Enter commit hash, count, or -1 to disable)"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "动态清单仓库所有者//Manifest repository owner"
        required: true
        default: "4545189wj"
      BUILD_TIME:
        type: string
        description: "自定义构建时间(输入F使用UTCT或-1关闭)//Custom build time (Enter F to use UTCT, or -1 to disable)"
        required: false
        default: "Fri Dec 12 11:37:03 UTC 2025"
      KSU_META:
        type: string
        description: "管理器分支名(必填)/内置分支名(必填)/自定义版本标识(留空不修改)/回退分支提交哈希版本(留空不修改)//Manager Branch name (Required) / Builtin branch name (Required) / Custom version identifier (Leave blank to not modify) / Rollback branch commit hash version (Leave blank to not modify)"
        required: false
        default: "main/builtin/Numbersf/"
      LZ4_UPDATE:
        type: boolean
        description: "是否升级LZ4到上游最新？//Upgrade LZ4 to the latest upstream?"
        required: true
        default: false
      ZRAM:
        type: string
        description: "ZRAM(0关闭1开启)/算法名/大小//ZRAM (0: disable, 1: enable) / Algorithm name / Size"
        required: true
        default: "0/lz4kd/8589934592"
      SUFFIX:
        type: string
        description: "自定义内核后缀(不输入使用RAND_STR或-1关闭)//Custom kernel suffix (Leave blank to use RAND_STR, or -1 to disable)"
        required: false
        default: ""
      RESUBLEVEL:
        description: "自定义内核等级欺骗(SUBLEVEL)//Custom kernel SUBLEVEL spoofing"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？//Enable ultra-fast build?"
        required: true
        default: true
      LSM_BBG:
        type: boolean
        description: "是否启用关键分区写入保护模块(BBG)？//Enable critical partition write protection module (BBG)?"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "是否启用网络功能拓展(NETFILTER)？//Enable network feature extensions (NETFILTER)?"
        required: true
        default: true
      CCM:
        type: boolean
        description: "是否启用网络拥塞控制与管理机制(BBR+ECN)？//Enable network congestion control and management mechanism (BBR+ECN)?"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "是否添加Unicode不可见字码点绕过读取漏洞修复？//Add patch for Unicode invisible code point read bypass vulnerability?"
        required: true
        default: false
      SCHED_HMBIRD:
        type: boolean
        description: "是否添加风驰驱动1.0？//Add Fengchi (HMBIRD) Driver 1.0?"
        required: true
        default: false
      DROID_SPACES:
        type: boolean
        description: "是否添加轻量级Linux容器支持(DroidSpaces)？//Add lightweight Linux container support (DroidSpaces)?"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "是否添加Re-Kernel？//Add Re-Kernel?"
        required: true
        default: false
      SUSFS_DEV:
        type: boolean
        description: "是否拉取SUSFS-DEV分支？//Pull the SUSFS-DEV branch?"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "是否停用空间清扫？//Disable workspace cleaning?"
        required: true
        default: false
      BUILD_NOCACHE:
        type: boolean
        description: "是否停用此次缓存？//Disable caching for this build?"
        required: true
        default: false

jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ contains(github.event.inputs.FILE, '_aosp') && ' [AOSP]' || '' }}${{ github.event.inputs.KPM == 'KPM' && ' [KPM]' || github.event.inputs.KPM == 'KPN' && ' [KPN]' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && ' [BBG]' || '' }}${{ github.event.inputs.SCHED_HMBIRD == 'true' && ' [HMBIRD]' || '' }}${{ github.event.inputs.DROID_SPACES == 'true' && ' [DS]' || '' }}${{ startsWith(github.event.inputs.ZRAM, '1/') && ' [ZRAM]' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && ' [REKER]' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && ' [LZ4UPD]' || '' }}For ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"
          mkdir kernel_workspace && cd kernel_workspace
          git clone https://github.com/Numbersf/Action-Build.git -b SukiSU-Ultra

      - name: Extract Manifest Info
        id: extract_info
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_bak//g; /_aosp/{s/_aosp//g;s/$/(AOSP)/;}; s/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/RealME/; s/^oppo/OPPO/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV

          # 动态调用源码清单仓库，仓库优先级：1️⃣ OnePlusOSS → 2️⃣ Dynamic → 3️⃣ Appendix
          DYNAMIC_REPO_INPUT="${{ github.event.inputs.DYNAMIC_REPO }}"
          declare -A REPOS
          REPOS["OnePlusOSS"]="OnePlusOSS|kernel_manifest"
          REPOS["Dynamic"]="4545189wj|kernel_manifest"
          REPOS["Appendix"]="Numbersf|Kernel_Manifest_Appendix"

          FOUND_REPO=""
          FOUND_BRANCH=""

          check_repo() {
            local ENTRY=$1
            local OWNER=${ENTRY%%|*}
            local REPO_NAME=${ENTRY##*|}

            echo "🌐 尝试拉取 ${OWNER}/${REPO_NAME} 分支列表..."
            BRANCHES=$(git ls-remote --heads https://github.com/${OWNER}/${REPO_NAME}.git | sed 's|.*refs/heads/||')

            if [[ -z "$BRANCHES" ]]; then
              echo "⚠️ ${OWNER}/${REPO_NAME} 分支列表获取失败，请尝试重新运行工作流。"
              return 1
            fi
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/README.md"

              if curl -sf --head "$XML_URL" >/dev/null; then
                echo "✅ 在 ${OWNER}/${REPO_NAME} 找到 ${FILE}.xml (分支: ${BRANCH})"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true

                FOUND_REPO="$OWNER"
                FOUND_REPO_NAME="$REPO_NAME"
                FOUND_BRANCH="$BRANCH"

                return 0
              fi
            done
            return 1
          }
          if ! check_repo "${REPOS["Dynamic"]}"; then
            if ! check_repo "${REPOS["Appendix"]}"; then
              check_repo "${REPOS["OnePlusOSS"]}"
            fi
          fi
          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "❌ 无法在任何仓库中找到 ${FILE}.xml"
            exit 8
          fi
          echo "MANIFEST_REPO=$FOUND_REPO" >> "$GITHUB_ENV"
          echo "MANIFEST_REPO_NAME=$FOUND_REPO_NAME" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> "$GITHUB_ENV"

          # 解析 revision 字符串
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "解析 FILE 获取 CPU 和 ANDROID_VERSION..."
          # 提取 CPU
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # 提取 ANDROID_VERSION
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          if [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; then
            echo "✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            # 获取短位 Android 版本号
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          else
            echo "❌ 无法从 revision 中提取 CPU 或 ANDROID_VERSION"
            exit 1
          fi

          echo "解析 README.md 获取 CPUD 和 BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "❌ README.md 中未找到构建命令"
            fi
          else
            echo "❌ README.md 下载失败或为空"
          fi

          # 传递组合信息
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        env:
          BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}
          SUFFIX: ${{ github.event.inputs.SUFFIX }}
        run: |
          echo "------------------------------"

          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          if [ "${{ github.event.inputs.SUSFS_CI }}" != "N/A" ]; then
            echo "::warning title=SUSFS Not Required::当前管理器已自带附加模块，无需启用 SUSFS 模块，强制启用可能导致不开机。"
          fi
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"
          echo "Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected LSM_BBG: ${{ github.event.inputs.LSM_BBG }}"
          echo "Selected NETFILTER: ${{ github.event.inputs.NETFILTER }}"
          echo "Selected CCM: ${{ github.event.inputs.CCM }}"
          echo "Selected SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}"
          echo "Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "Selected SCHED_HMBIRD: ${{ github.event.inputs.SCHED_HMBIRD }}"
          echo "Selected UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}"
          echo "Selected DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}"
          echo "Selected RE_KERNEL: ${{ github.event.inputs.RE_KERNEL }}"
          echo "Selected LZ4_UPDATE: ${{ github.event.inputs.LZ4_UPDATE }}"
          echo "Custom BUILD_TIME: $BUILD_TIME"
          echo -n "BUILD_TIME Unicode: "
          CHECK_TEXT="$BUILD_TIME" python3 "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py" --mode build_time
          echo "Custom SUFFIX: $SUFFIX"
          echo -n "SUFFIX Unicode: "
          CHECK_TEXT="$SUFFIX" python3 "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py" --mode suffix

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Fork Check
        run: |
          repo="${{ github.repository }}"; json=$(curl -s "https://api.github.com/repos/$repo")
          parent=$(echo "$json" | grep -o '"full_name": *"[^"]*"' | head -n 2 | tail -n 1 | sed 's/.*"full_name": *"\([^"]*\)".*/\1/')
          if [ -n "$parent" ] && [ "$parent" != "Numbersf/Action-Build" ]; then
            echo "::warning title=Source Warning::您使用的内核编译地址为非官方源，可能导致运行失败或内核异常。"
          fi

      - name: Reject Check
        run: |
          REJ_CHECKER="$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_rejects.sh"
          chmod +x "$REJ_CHECKER"
          echo "REJ_CHECKER=$REJ_CHECKER" >> $GITHUB_ENV

      - name: Restore APT Cache
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: ~/.apt-pkg-cache
          key: apt-cache-${{ runner.os }}-${{ github.ref_name }}-v5

      - name: Install Dependencies
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libelf-dev libdw-dev
          export APT_PACKAGES="python3 git curl libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves kotlin pkg-config"
          bash "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/cache_apt_pkgs.sh" ~/.apt-pkg-cache
          pkg-config --modversion libelf
          pkg-config --cflags libelf
          pkg-config --libs libelf

      - name: Install Ccache-ECS
        run: |
         LIB_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/lib"
         sudo cp -f "$LIB_DIR/ccache" /usr/bin/ccache && sudo chmod +x /usr/bin/ccache

      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.8

      - name: Restore ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' }}
        id: restore-thinlto
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-16.8

      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "初始化 ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          else
            echo "❌ 未安装 ccache，跳过"
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          BASE_URL="https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git"

          echo "使用$MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)初始化仓库..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --depth=1 --no-clone-bundle --no-tags
          sed -i -e '/prebuilts\/asuite"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' -e '/tools\/tradefederation\/prebuilts"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' ".repo/manifests/${FILE}.xml"
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          KERNEL_REPOS=""
          KERNEL_REPOS_PATH=$(find . -type f -name "build.config.msm.common" | head -n 1)
          if [[ -n "$KERNEL_REPOS_PATH" ]]; then
            KERNEL_REPOS=$(echo "${KERNEL_REPOS_PATH#./}" | cut -d/ -f2)
            echo "✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH"
            echo "✅ KERNEL_REPOS=$KERNEL_REPOS"
            echo "KERNEL_REPOS=$KERNEL_REPOS" >> "$GITHUB_ENV"
          else
            echo "❎ 未找到 build.config.msm.common，可能是天玑清单或纯 Kleaf 构建结构"
          fi

          # 移除 ABI 保护
          for dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done

          # 移除构建审查
          if grep -q 'check_defconfig' kernel_platform/common/build.config.gki; then
            sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki
          fi
          if grep -q 'check_defconfig = None,' kernel_platform/build/kernel/kleaf/common_kernels.bzl; then
            sed -i 's/check_defconfig = None,/check_defconfig = "disabled",/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
            sed -i 's/if check_defconfig == None:/if False:  # check_defconfig == None:/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
          fi

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION 2位)
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              KMI=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$KMI" ] && break
            fi
          done
          if [[ -z "$KMI" && -n "$KERNEL_REPOS" ]]; then
            KMI=$(grep -m1 '^android' "./$KERNEL_REPOS/android/ACK_SHA" | cut -d- -f1,2)
          fi
          if [ -n "$KMI" ]; then
            echo "KMI=$KMI" >> $GITHUB_ENV
            echo "KANDROID_VERSION=${KMI%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${KMI#*-}" >> $GITHUB_ENV
          else
            echo "No KMI found in build.config* and ACK_SHA files"
          fi

          # 从 Makefile 获取完整内核版本号 (CD) 并拆分
          VERSIONLEVEL=$(awk '/^VERSION =/ {print $3}' ./common/Makefile)
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/ {print $3}' ./common/Makefile)
          SUBLEVEL=$(awk '/^SUBLEVEL =/ {print $3}' ./common/Makefile)
          echo "VERSIONLEVEL=$VERSIONLEVEL" >> $GITHUB_ENV
          echo "PATCHLEVEL=$PATCHLEVEL" >> $GITHUB_ENV
          # SUBLEVEL 仅传递修改前的值，因为伪装并不影响原源码状态
          echo "SUBLEVEL=$SUBLEVEL" >> $GITHUB_ENV
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          # 强制修改 SUBLEVEL (内核等级)
          RESUBLEVEL="${{ github.event.inputs.RESUBLEVEL }}"
          if [ -n "$RESUBLEVEL" ]; then
            echo "修改 SUBLEVEL 为 $RESUBLEVEL"
            sed -i "s/^SUBLEVEL[[:space:]]*=[[:space:]]*.*/SUBLEVEL = $RESUBLEVEL/" ./common/Makefile
          else
            echo "未指定 SUBLEVEL，保持默认"
          fi

          # 读取修改后的版本
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          # CKERNEL_VERSION(3位)：被修改之后或者未经过修改的完整内核版本号，用于欺骗系统
          # DKERNEL_VERSION(3位)：被修改之前的完整内核版本号，真实值
          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "CKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "DKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "CKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi

          # 内核版本的数字转换，仅前两位不包含 SUBLEVEL
          echo "KERNEL_SHORT_PATCH_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV

      - name: Rust Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 从 build.config.constants 读取 RUSTC_VERSION
          RUSTC_VERSION=""
          if [[ -f ./common/build.config.constants ]]; then
            RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [[ -n "$RUSTC_VERSION" ]]; then
            echo "✅ RUSTC_VERSION(原始)=$RUSTC_VERSION"
            RUSTC_DIR_VERSION=$(echo "$RUSTC_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            if [[ -z "$RUSTC_DIR_VERSION" ]]; then
              RUSTC_DIR_VERSION="$RUSTC_VERSION"
            fi
            echo "✅ RUSTC_DIR_VERSION(用于目录匹配)=$RUSTC_DIR_VERSION"
            echo "RUSTC_VERSION=$RUSTC_VERSION" >> $GITHUB_ENV
            echo "RUSTC_DIR_VERSION=$RUSTC_DIR_VERSION" >> $GITHUB_ENV
            echo "ENABLE_RUST=true" >> $GITHUB_ENV
          else
            echo "✅ RUSTC_VERSION 未找到，Rust 编译已禁用"
            echo "ENABLE_RUST=false" >> $GITHUB_ENV
          fi

      # 自定义内核后缀
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.SUFFIX != '' && github.event.inputs.SUFFIX != '-1' }}
        run: |
          cd kernel_workspace/kernel_platform
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting suffix via cut/echo"
                if [[ -f ./build_with_bazel.py ]]; then
                  echo "使用官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请修改"
                  echo "When using the official script and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens."
                fi
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      # 伪官方格式的随机后缀（仅在 SUFFIX 未设置时生效）*
      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.SUFFIX == '' }}
        run: |
          cd kernel_workspace/kernel_platform
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          # 生成随机数字和随机hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res with random suffix"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting random suffix via cut/echo"
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      - name: Add SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          KSU_META="${{ github.event.inputs.KSU_META }}"

          # 必须包含两个分隔符（至少四个字段）
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 3 ]]; then
            echo "错误: KSU_META 参数缺少必要的分隔符 '/'，格式应为: 管理器分支名/内置分支名/自定义标识(可省略)/提交hash(可省略)"
            exit 10
          fi

          # 解析字段：分支 / 自定义标识 / 手动 hash
          IFS='/' read -r KSU_MANAGER_BRANCH KSU_BUILTIN_BRANCH KSU_CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          echo "KSU_MANAGER_BRANCH=$KSU_MANAGER_BRANCH" >> $GITHUB_ENV
          echo "KSU_BUILTIN_BRANCH=$KSU_BUILTIN_BRANCH" >> $GITHUB_ENV
          [[ -n "$KSU_CUSTOM_TAG" ]] && echo "自定义版本标识: $KSU_CUSTOM_TAG" || echo "自定义版本标识: 未启用"
          [[ -n "$MANUAL_HASH" ]] && echo "手动指定 hash: $MANUAL_HASH" || echo "手动指定 hash: 未启用"

          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${KSU_MANAGER_BRANCH}/kernel/setup.sh" | bash -s "$KSU_BUILTIN_BRANCH"
          cd ./KernelSU

          # 如果指定了手动 hash，就切换到该提交
          if [[ -n "$MANUAL_HASH" ]]; then
            git fetch origin "$KSU_BUILTIN_BRANCH" --depth=50
            git checkout "$MANUAL_HASH"
            SHORT_HASH=${MANUAL_HASH:0:8}
          fi

          KSU_VERSION_TAG=$(curl -fsSL https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest \
            | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/')
          if [[ -z "$KSU_VERSION_TAG" || "$(printf '%s\n' "$KSU_VERSION_TAG" "3.1.7" | sort -V | head -n1)" != "3.1.7" ]]; then
            KSU_VERSION_TAG="3.1.7"
          fi
          echo "KSU_VERSION_TAG=$KSU_VERSION_TAG" >> $GITHUB_ENV

          GIT_HASH=$(git rev-parse --short HEAD)
          echo "GIT_HASH=$GIT_HASH"

          # 组装版本号
          if [[ -n "$MANUAL_HASH" ]]; then
            USE_HASH="$SHORT_HASH"
          else
            USE_HASH="$GIT_HASH"
          fi
          if [[ -z "$KSU_CUSTOM_TAG" ]]; then
            VERSION_FULL="v$KSU_VERSION_TAG-$USE_HASH@$KSU_BUILTIN_BRANCH"
          else
            VERSION_FULL="v$KSU_VERSION_TAG-$KSU_CUSTOM_TAG@$KSU_BUILTIN_BRANCH[$USE_HASH]"
          fi

          ESC_VERSION_FULL=$(printf '%s' "$VERSION_FULL" | sed 's/[&|\\/]/\\&/g')
          ESC_KSU_VERSION_TAG=$(printf '%s' "$KSU_VERSION_TAG" | sed 's/[&|\\/]/\\&/g')

          if grep -q '^KSU_VERSION_FULL := ' kernel/Makefile; then
            sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := $ESC_VERSION_FULL|" kernel/Makefile
          else
            awk -v full="$VERSION_FULL" '
              /^REPO_OWNER :=/ && !done {
                print
                print ""
                print "KSU_VERSION_FULL := " full
                done=1
                next
              }
              { print }
            ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile
          fi

          if grep -q '^KSU_VERSION_API := ' kernel/Makefile; then
            sed -i "s|^KSU_VERSION_API := .*|KSU_VERSION_API := $ESC_KSU_VERSION_TAG|" kernel/Makefile
          fi

          KSU_VERSION=$(expr $(git rev-list --count "$KSU_MANAGER_BRANCH" 2>/dev/null || echo 13000) + 37185)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

          echo "::group::最终 Makefile 中版本信息及部分调试结果预览"
          grep -nE '^(REPO_OWNER|REPO_NAME|REPO_BRANCH|KSU_VERSION_API|KSU_VERSION_FULL|VERSION_TAG|GIT_BIN|CURL_BIN)' kernel/Makefile
          echo "::endgroup::"

      - name: Apply Fake Patches
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        run: |
          kotlinc -script "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" apply "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

      - name: Apply Patches SukiSU Ultra
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{ github.event.inputs.SUSFS_DEV == 'true' && '-dev' || '' }}
            cd susfs4ksu
            if [ -n "$SUSFS_META" ]; then
              if [[ "$SUSFS_META" =~ ^[0-9]+$ ]]; then
                git checkout HEAD~$SUSFS_META
              else
                git checkout "$SUSFS_META"
              fi
            else
              echo "SUSFS_META 为空，使用最新上游 SUSFS"
            fi
            cd ..
          fi
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            git clone https://github.com/Sakion-Team/Re-Kernel.git
          fi
          if [ "${{ github.event.inputs.LZ4_UPDATE }}" = "true" ]; then
            git clone https://github.com/Numbersf/lz4_oplus.git
          fi
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "正在拉取susfs补丁"
            cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          fi

          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            echo "正在拉取zram补丁"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common

          if [ "$KMI" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "修复内核版本为5.15.0~5.15.123仅支持旧版C库造成的一些bug"
            cp "${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/fix_5.15.legacy" ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
            echo "fix_5.15_patch完成"
          fi

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "正在打susfs补丁"
            patch -p1 < 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            echo "susfs_patch完成"
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Revert Fake Patches
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        run: |
          kotlinc -script "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" revert "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

      # OGKI转换GKI，无需修改 dtbo 开机
      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ (fromJSON(env.VERSIONLEVEL) > 6 || (fromJSON(env.VERSIONLEVEL) == 6 && fromJSON(env.PATCHLEVEL) >= 6)) && github.event.inputs.SCHED_HMBIRD == 'false' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          echo "正在打OGKI转换GKI补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/hmbird_patch.patch" || true
          echo "OGKI转换GKI_patch完成"
          source $REJ_CHECKER
          check_rejects .

      - name: Apply UNICODE_BYPASS
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [ "$VERSIONLEVEL" -lt 6 ]; then
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          RE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source"
          cd kernel_workspace/kernel_platform/common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          cp -r "${RE_DIR}"/* drivers/rekernel/
          if [ -f BUILD.bazel ]; then
            sed -i '0,/name = "kernel_aarch64",/{/module_implicit_outs/s|,$| + ["drivers/rekernel/rekernel.ko"],|}' BUILD.bazel
          fi

      - name: Apply DROID_SPACES
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.DROID_SPACES == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          # 注释掉原始的 sysv 结构体定义
          sed -i 's/^\(\t\)struct sysv_sem\b.*sysvsem;/\1\/\/ struct sysv_sem\t\t\tsysvsem;/' include/linux/sched.h
          sed -i 's/^\(\t\)struct sysv_shm\b.*sysvshm;/\1\/\/ struct sysv_shm\t\t\tsysvshm;/' include/linux/sched.h

          if [ "$KMI" = "android12-5.10" ]; then
            echo "为 android12-5.10 修复 sysvipc KABI 绕过及 POSIX_MQUEUE ABI 填充问题..."
            sed -i '/^\tconst struct sched_class\t\*sched_class;/a \\n#ifndef __GENKSYMS__\n\tstruct sysv_sem\t\t\tsysvsem;\n\tstruct sysv_shm\t\t\tsysvshm;\n#endif\n' include/linux/sched.h
            sed -i 's/^\tunsigned long mq_bytes;\t\/\* How many bytes can be allocated to mqueue[?] \*\//\t\/\/unsigned long mq_bytes;\t\/* How many bytes can be allocated to mqueue? *\//' include/linux/sched/user.h
            sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1, 2);/{/^\tANDROID_KABI_RESERVE(1);/{N;N;s/^\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);/#if defined(CONFIG_POSIX_MQUEUE)\n\tANDROID_KABI_USE(1, unsigned long mq_bytes);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#endif/}}' include/linux/sched/user.h
          # 检查 sched.h 并修改 KABI 槽位或指针
          elif grep -q "sched_dl_entity.*\*dl_server" include/linux/sched.h; then
            echo "✅ 检测到 dl_server 指针，使用 packed union 方案"
            sed -i 's|\tstruct sched_entity\t\tse;|#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n\n\tstruct sched_entity\t\tse;|' include/linux/sched.h
          elif grep -q "ANDROID_KABI_USE(1," include/linux/sched.h; then
            echo "✅ 检测到 USE(1)，使用槽位 6,7,8"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(1);" include/linux/sched.h; then
            echo "✅ 检测到 RESERVE(1)，使用槽位 1,2,3"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(3);" include/linux/sched.h; then
            echo "✅ fallback，使用槽位 3,4,5"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif\n\tANDROID_KABI_RESERVE(6);|;}' include/linux/sched.h
          else
            echo "❌ 无法通过上下文精准匹配 KABI 槽位或对应指针"
            exit 9
          fi

          echo "为 oplus_bsp_midas 模块返回幽灵任务以避免空指针崩溃..."
          patch -p1 --forward < "${PATCH_DIR}/ghost-task-for-midas.patch" || true

          if [ "$KMI" = "android16-6.12" ]; then
            rm -f include/uapi/linux/ntsync.h
            rm -f drivers/misc/ntsync.c
            echo "补全 IPC NS 符号导出..."
            if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' ./ipc/namespace.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> ./ipc/namespace.c
            fi
            if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' ./ipc/msgutil.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> ./ipc/msgutil.c
            fi
          fi
          echo "拓展 ntsync 支持..."
          patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_base.patch" || true
          if [[ "$FILE" == oneplus_10r* ]]; then
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_android12-5.10_14.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_$([ -f "${PATCH_DIR}/ntsync/ntsync_compat_${KMI}_${ANDROID_SHORT_VERSION}.patch" ] && echo "${KMI}_${ANDROID_SHORT_VERSION}" || echo "${KMI}").patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .

      - name: Apply LZ4_DEV
        if: ${{ github.event.inputs.LZ4_UPDATE == 'true' }}
        run: |
          set -euo pipefail
          LZ4_REPO="${GITHUB_WORKSPACE}/kernel_workspace/lz4_oplus"
          cd kernel_workspace/kernel_platform/common
          . "${LZ4_REPO}/apply_lz4_oplus.sh"

      - name: Apply ZRAM
        if: startsWith(github.event.inputs.ZRAM, '1/')
        run: |
          ZRAM="${{ github.event.inputs.ZRAM }}"
          if [[ "$(grep -o '/' <<< "$ZRAM" | wc -l)" -lt 2 ]]; then
            echo "错误: ZRAM 参数缺少必要的分隔符 '/'，格式应为: 总开关0关1开/算法名(前面输入0时无效)/大小(前面输入0时无效)"
            exit 10
          fi
          # 解析字段：开关状态 / 算法名 / 大小
          IFS='/' read -r ZRAM_SWSTA ZRAM_ALGO ZRAM_SIZE <<< "$ZRAM"
          echo "ZRAM_ALGO=$ZRAM_ALGO" >> $GITHUB_ENV
          echo "ZRAM_ALGO_U=${ZRAM_ALGO^^}" >> $GITHUB_ENV
          echo "ZRAM_SIZE=$ZRAM_SIZE" >> $GITHUB_ENV

          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform/common
          if [[ "$KERNEL_VERSION" == "5.10" && "${CPU}" == mt* ]]; then
            sed -i 's/select CRYPTO_LZO/depends on CRYPTO_LZO/' ./mm/oplus_mm/hybridswap_zram/Kconfig
          fi
          echo "正在打lz4kd补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4kd.patch" || true
          echo 'lz4kd_patch完成'
          echo "正在打lz4k_oplus补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4k_oplus.patch" || true
          echo 'lz4k_oplus_patch完成'
          source $REJ_CHECKER
          check_rejects .

      - name: Apply SCHED_HMBIRD
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.SCHED_HMBIRD == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          CLEAN_FILE="${FILE//_bak/}"
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b $CPU || { echo "❌ CPU 分支不存在，风驰内核暂未支持你的机型，请关闭后重试"; exit 11; }
          echo "正在拉取风驰补丁"
          cp ./SCHED_PATCH/fengchi_${CLEAN_FILE}.patch ./
          if [[ -f "fengchi_${CLEAN_FILE}.patch" ]]; then
            echo "正在打风驰补丁"
            dos2unix "fengchi_${CLEAN_FILE}.patch"
            patch -p1 -F 3 < "fengchi_${CLEAN_FILE}.patch"
            echo "fengchi_patch完成"
            source $REJ_CHECKER
            check_rejects .
          else
            echo "❌ 未匹配到补丁，风驰内核暂未支持你的机型，请关闭后重试"
            exit 12
          fi

      - name: Apply LSM_BBG
        if: ${{ github.event.inputs.LSM_BBG == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "正在启用内核级基带保护支持…"
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig

      # 配置信息，带*为附加项目，具有一定危险性和不确定性
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          MAKEFILE=./kernel/Makefile

          declare -a HIDE_CONFIGS=()

          set_config() {
            local val="$1"
            local key="${val%%=*}"
            if grep -qF "${key}=" "$CONFIG_FILE" || grep -qF "# ${key} is not set" "$CONFIG_FILE"; then
              VAL="$val" awk -v key="$key" '
                $0 == "# " key " is not set" || index($0, key "=") == 1 { print ENVIRON["VAL"]; next }
                { print }
              ' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp" && mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE" || rm -f "${CONFIG_FILE}.tmp"
            else
              printf '%s\n' "$val" >> "$CONFIG_FILE"
            fi
          }

          set_hide_config() {
            local val="$1"
            local key="${val%%=*}"
            set_config "$val"
            HIDE_CONFIGS+=("$key")
          }

          inject_fake_config() {
            [ "${#HIDE_CONFIGS[@]}" -eq 0 ] && return 0
            local marker="# --- fake_config injector ---"
            if ! grep -qF "$marker" "$MAKEFILE"; then
              {
                printf '\n%s\n' "$marker"
                printf 'ifneq ($(strip $(CONFIG_FAKE_DISABLE)),)\n'
                printf '$(obj)/config_data: $(KCONFIG_CONFIG) FORCE\n'
                printf '\t$(Q)sed $(foreach opt,$(CONFIG_FAKE_DISABLE),-e '"'"'s|^$(opt)=.*|# $(opt) is not set|'"'"') $(KCONFIG_CONFIG) > $@\n'
                printf 'endif\n'
              } >> "$MAKEFILE"
            fi
            echo "CONFIG_FAKE_DISABLE=${HIDE_CONFIGS[*]}" >> "$GITHUB_ENV"
          }
          trap 'inject_fake_config' EXIT

          # SukiSU Ultra配置
          set_config "CONFIG_KSU=y"

          # KPM配置
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ] || [ "${{ github.event.inputs.KPM }}" = "N/A" ]; then
            set_config "CONFIG_KPM=y"
          fi
          if [ "${{ github.event.inputs.KPM }}" = "KPN" ]; then
            set_config "CONFIG_KPM=n"
          fi

          # SUSFS配置
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            set_config "CONFIG_KSU_SUSFS=y"
            set_config "CONFIG_KSU_SUSFS_SUS_PATH=y"
            set_config "CONFIG_KSU_SUSFS_SUS_MAP=y"
            set_config "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            set_config "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            set_config "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            set_config "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            set_config "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          else
            set_config "CONFIG_KSU_SUSFS=n"
          fi

          # TMPFS配置*
          set_config "CONFIG_TMPFS_XATTR=y"
          set_config "CONFIG_TMPFS_POSIX_ACL=y"

          # BBR & ECN配置*
          if [ "${{ github.event.inputs.CCM }}" = "true" ]; then
            set_hide_config "CONFIG_TCP_CONG_ADVANCED=y"
            set_config "CONFIG_TCP_CONG_BBR=y"
            set_config "CONFIG_NET_SCH_FQ=y"
            set_config "CONFIG_TCP_CONG_BIC=n"
            set_config "CONFIG_TCP_CONG_WESTWOOD=n"
            set_config "CONFIG_TCP_CONG_HTCP=n"
            set_config "CONFIG_IP_ECN=y"
            set_config "CONFIG_TCP_ECN=y"
            set_config "CONFIG_IPV6_ECN=y"
            set_config "CONFIG_IP_NF_TARGET_ECN=y"
          fi

          # Re-Kernel配置*
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            set_config "CONFIG_REKERNEL=y"
            set_config "CONFIG_REKERNEL_NETWORK=y"
          fi

          # ZRAM配置*
          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            set_config "CONFIG_CRYPTO_LZ4HC=y"
            set_config "CONFIG_CRYPTO_LZ4K=y"
            set_config "CONFIG_CRYPTO_LZ4KD=y"
            set_config "CONFIG_CRYPTO_842=y"
            set_config "CONFIG_CRYPTO_LZ4K_OPLUS=y"
            set_config "CONFIG_ZRAM_WRITEBACK=y"
          fi

          # LSM配置*
          if [ "${{ github.event.inputs.LSM_BBG }}" = "true" ]; then
            set_config "CONFIG_BBG=y"
          fi

          # DROID_SPACES配置*
          if [ "${{ github.event.inputs.DROID_SPACES }}" = "true" ]; then
            set_config "CONFIG_NTSYNC=y"
            set_config "CONFIG_SYSVIPC=y"
            set_config "CONFIG_DEVTMPFS=y"
            set_config "CONFIG_PID_NS=y"
            set_config "CONFIG_IPC_NS=y"
            set_config "CONFIG_USER_NS=y"
            set_config "CONFIG_NAMESPACES=y"
            set_config "CONFIG_POSIX_MQUEUE=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            set_config "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            set_config "CONFIG_DEBUG_INFO=y"
            set_config "CONFIG_DEBUG_INFO_BTF=y"
            set_config "CONFIG_DEBUG_INFO_DWARF4=y"
            set_config "CONFIG_DEBUG_INFO_DWARF5=n"
            set_config "CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=n"
          fi

          # IPSET & IPv6_NAT & TTL配置*
          if [ "${{ github.event.inputs.NETFILTER }}" = "true" ]; then
            if [[ "$KERNEL_VERSION" != "6.12" && "${CPU}" != mt* ]]; then
              set_config "CONFIG_BPF_STREAM_PARSER=y"
            fi
            set_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            set_config "CONFIG_NETFILTER_XT_SET=y"
            set_config "CONFIG_IP_SET=y"
            set_config "CONFIG_IP_SET_MAX=65534"
            set_config "CONFIG_IP_SET_BITMAP_IP=y"
            set_config "CONFIG_IP_SET_BITMAP_IPMAC=y"
            set_config "CONFIG_IP_SET_BITMAP_PORT=y"
            set_config "CONFIG_IP_SET_HASH_IP=y"
            set_config "CONFIG_IP_SET_HASH_IPMARK=y"
            set_config "CONFIG_IP_SET_HASH_IPPORT=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTIP=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_IPMAC=y"
            set_config "CONFIG_IP_SET_HASH_MAC=y"
            set_config "CONFIG_IP_SET_HASH_NETPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_NET=y"
            set_config "CONFIG_IP_SET_HASH_NETNET=y"
            set_config "CONFIG_IP_SET_HASH_NETPORT=y"
            set_config "CONFIG_IP_SET_HASH_NETIFACE=y"
            set_config "CONFIG_IP_SET_LIST_SET=y"
            set_hide_config "CONFIG_IP6_NF_NAT=y"
            set_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_HL=y"
            set_config "CONFIG_IP_NF_TARGET_TTL=y"
            set_config "CONFIG_IP6_NF_TARGET_HL=y"
            set_config "CONFIG_NETFILTER_XT_MATCH_HL=y"
            set_config "CONFIG_IP_NF_MATCH_TTL=y"
            set_config "CONFIG_IP6_NF_MATCH_HL=y"
            set_config "CONFIG_IP_NF_MANGLE=y"
            set_config "CONFIG_IP6_NF_MANGLE=y"
          fi

          # 构建依赖项调整及优化
          if [ "$KERNEL_VERSION" = "5.15" ] && [[ "$CPU" == mt* ]]; then
            set_config "CONFIG_OPLUS_SYSTEM_KERNEL=y"
            set_config "CONFIG_OPLUS_FEATURE_CMDLINE=m"
            set_config "CONFIG_OPLUS_FEATURE_OPLUSBOOT=m"
            set_config "CONFIG_OPLUS_FEATURE_BUILDVARIANT=m"
            set_config "CONFIG_OPLUS_FEATURE_OPROJECT=m"
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            set_config "CONFIG_RUST=y"
            set_config "CONFIG_ANDROID_BINDER_IPC_RUST=m"
          fi

      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in ./common/scripts/mkcompile_h ./"$KERNEL_REPOS"/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          echo "Disabling GPUEB for MTK kernel 5.10"
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile

      - name: Build Kernel FAST
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          cd kernel_workspace/kernel_platform

          # 自动检测 LLVM_IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi

          # 强制递推路径
          CLANG_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/clang/host/linux-x86' \; -print | head -1)
          CLANG_PREBUILT_NAME=$(basename "${CLANG_PREBUILT_NAME:-}")
          echo "✅ CLANG_PREBUILT_NAME=$CLANG_PREBUILT_NAME"

          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/kernel-build-tools' \; -print | head -1)
          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(basename "${KERNEL_BUILD_TOOLS_PREBUILT_NAME:-}")
          echo "✅ KERNEL_BUILD_TOOLS_PREBUILT_NAME=$KERNEL_BUILD_TOOLS_PREBUILT_NAME"

          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUST_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/rust' \; -print | head -1)
            RUST_TOOLS_PREBUILT_NAME=$(basename "${RUST_TOOLS_PREBUILT_NAME:-}")
            echo "✅ RUST_TOOLS_PREBUILT_NAME=$RUST_TOOLS_PREBUILT_NAME"
          fi

          # 从 build.config.common 读取 CLANG_PREBUILT_BIN，或者用递推路径 fallback
          CLANG_PREBUILT_BIN=""
          if [[ -f ./common/build.config.common ]]; then
            CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common | cut -d'=' -f2-)
          fi

          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            CLANG_PREBUILT_BIN="${CLANG_PREBUILT_NAME}/clang/host/linux-x86/clang-zakozako/bin"
          fi

          # 优先尝试从 CLANG_PREBUILT_BIN 识别出 clang-r，再去掉 clang-，作为 CLANG_VERSION
          if [[ "$CLANG_PREBUILT_BIN" =~ clang-(r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            # 如果未匹配到，尝试从 build.config.constants 提取
            if [[ -f ./common/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi

          if [[ -z "$CLANG_VERSION" ]]; then
            echo "⚠️ 未能从 CLANG_PREBUILT_BIN 或 build.config.constants 获取到 Clang 版本，回退至官方构建脚本"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "请考虑关闭 FAST_BUILD 并提交问题"
            exit 0
          fi

          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}"
          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/clang-zakozako/clang-${CLANG_VERSION}}"

          echo "✅ CLANG_PREBUILT_BIN=$CLANG_PREBUILT_BIN"
          echo "✅ CLANG_VERSION=$CLANG_VERSION"
          echo "✅ USE_LLVM_IAS=$USE_LLVM_IAS"

          set +u
          source "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh" 2>/dev/null || true
          set -u

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          CLANG_LIB_PATH="${CLANG_PREBUILT_BIN%/bin}"
          if [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib"
          elif [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib"
          else
            export LIBCLANG_PATH="$(clang --print-resource-dir 2>/dev/null | sed 's|/lib/clang/.*||')/lib" 
            echo "⚠️ LIBCLANG_PATH fallback to system: $LIBCLANG_PATH"
          fi
          echo "✅ LIBCLANG_PATH=$LIBCLANG_PATH"
          export PATH="/usr/lib/ccache:$PATH"

          # BINDGEN 检测与 fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            BINDGEN_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_NAME/clang-tools/linux-x86/bin/bindgen"
            if [ -x "$BINDGEN_BIN" ]; then
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ bindgen exists: $BINDGEN_BIN"
            else
              echo "⚠️ prebuilts bindgen 未找到，fallback 到 cargo 安装 bindgen 0.69.5"
              echo "::group::Install bindgen via cargo"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              source "$HOME/.cargo/env"
              cargo install bindgen-cli --version 0.69.5
              echo "::endgroup::"
              BINDGEN_BIN=$(which bindgen)
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ BINDGEN_BIN (cargo): $BINDGEN_BIN"
            fi
          fi

          # PAHOLE 检测与 fallback
          PAHOLE_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$KERNEL_BUILD_TOOLS_PREBUILT_NAME/kernel-build-tools/linux-x86/bin/pahole"
          if [ ! -x "$PAHOLE_BIN" ]; then
            PAHOLE_BIN="$(which pahole 2>/dev/null)"
            [ -x "$PAHOLE_BIN" ] && echo "⚠️ pahole fallback to PATH: $PAHOLE_BIN"
          fi
          if [ -x "$PAHOLE_BIN" ]; then
            echo "✅ pahole exists: $PAHOLE_BIN"
          else
            echo "❌ pahole 完全缺失，终止构建"
            exit 13
          fi

          # RUSTC 检测与 fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUSTC_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$RUST_TOOLS_PREBUILT_NAME/rust/linux-x86/$RUSTC_DIR_VERSION/bin/rustc"
            if [ ! -x "$RUSTC_BIN" ]; then
              RUSTC_BIN="$(which rustc 2>/dev/null)"
              [ -x "$RUSTC_BIN" ] && echo "⚠️ rustc fallback to PATH: $RUSTC_BIN"
            fi
            if [ -x "$RUSTC_BIN" ]; then
              echo "✅ rustc exists: $RUSTC_BIN"
              export RUSTC="$RUSTC_BIN"
            else
              echo "❌ rustc 完全缺失且 ENABLE_RUST=true，终止构建"
              exit 13
            fi
          fi

          LD_WRAPPER=""
          if [ "${{ github.event.inputs.BUILD_NOCACHE }}" = "false" ] && [[ "$KERNEL_VERSION" == 5.* ]]; then
            LDCACHE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/.thinlto-cache"
            mkdir -p "$LDCACHE_DIR"
            LD_WRAPPER="${GITHUB_WORKSPACE}/kernel_workspace/ld-wrapper"
            LLD_BIN="$(command -v ld.lld)"
            if [[ -z "$LLD_BIN" ]]; then
              echo "⚠️ ld.lld 未找到，无法创建 ld-wrapper"
            fi
            printf '#!/bin/bash\nexec "%s" "$@" --thinlto-cache-dir="%s" --thinlto-cache-policy=cache_size_bytes=3g --thinlto-jobs=%s\n' "$LLD_BIN" "$LDCACHE_DIR" "$(nproc --all)" > "$LD_WRAPPER"
            chmod +x "$LD_WRAPPER"
            echo "✅ ld-wrapper 已创建: $LD_WRAPPER (lld=$LLD_BIN, cache=$LDCACHE_DIR)"
          fi

          REAL_CLANG_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN/clang"
          CC_WRAPPER="$GITHUB_WORKSPACE/kernel_workspace/cc-wrapper"
          printf '#!/bin/bash\nexec ccache "%s" "$@"\n' "$REAL_CLANG_BIN" > "$CC_WRAPPER"
          chmod +x "$CC_WRAPPER"
          echo "✅ cc-wrapper 已创建: $CC_WRAPPER (clang=$REAL_CLANG_BIN)"

          cd ./common

          # 重映射物理路径
          COMMON_REAL_PATH=$(pwd -P)
          PLATFORM_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          ROOT_REAL_PATH=$(dirname "$PLATFORM_REAL_PATH")
          MAP="-fdebug-prefix-map=$ROOT_REAL_PATH=."
          MPMAP="-fmacro-prefix-map=$ROOT_REAL_PATH=."
          FPMAP="-ffile-prefix-map=$ROOT_REAL_PATH=."

          # KCFLAGS
          KCFLAGS="$MAP $FPMAP -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          KCPPFLAGS="$MPMAP"

          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="$CC_WRAPPER"
            HOSTCC="$CC_WRAPPER"
            HOSTLD=ld.lld
            PAHOLE="$PAHOLE_BIN"
            KCFLAGS="$KCFLAGS"
            KCPPFLAGS="$KCPPFLAGS"
          )

          if [[ -n "${CONFIG_FAKE_DISABLE:-}" ]]; then
            MAKE_ARGS+=(CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE")
          fi
          if [[ -n "$LD_WRAPPER" ]]; then
            MAKE_ARGS+=(LD="$LD_WRAPPER")
          else
            MAKE_ARGS+=(LD=ld.lld)     
          fi
          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS+=(LLVM_IAS=1)
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            MAKE_ARGS+=(RUSTC="$RUSTC_BIN")
            MAKE_ARGS+=(BINDGEN="$BINDGEN_BIN")
          fi

          make O=out "${MAKE_ARGS[@]}" gki_defconfig --no-print-directory

          if [[ "$KERNEL_VERSION" == 5.* ]]; then
            echo "# 设置 LTO = thin"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi

          make O=out "${MAKE_ARGS[@]}" olddefconfig --no-print-directory
          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}"
          ccache -s

      - name: Install newer pahole
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libelf-dev \
            libdw-dev \
            zlib1g-dev \
            pkg-config

          rm -rf /tmp/pahole

          git clone https://git.kernel.org/pub/scm/devel/pahole/pahole.git \
            --branch v1.27 \
            --depth=1 \
            --recurse-submodules \
            /tmp/pahole

          cmake -S /tmp/pahole -B /tmp/pahole/build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build /tmp/pahole/build -j"$(nproc)"

          sudo install -m755 \
            /tmp/pahole/build/pahole \
            /usr/local/bin/pahole

          echo "/usr/local/bin" >> "$GITHUB_PATH"

          echo "=== Installed pahole ==="
          ls -l /usr/local/bin/pahole

          PAHOLE_VERSION=$(/usr/local/bin/pahole --version 2>&1 | head -n 1)
          echo "$PAHOLE_VERSION"

          case "$PAHOLE_VERSION" in
            *v1.27*)
              echo "✅ pahole v1.27 ready"
              ;;
            *)
              echo "❌ unexpected pahole version: $PAHOLE_VERSION"
              exit 1
              ;;
          esac

      - name: Fallback to Build Kernel
        if: github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true'
        run: |
          cd kernel_workspace

          mkdir -p "out/target/product/$CPUD"

          # ============================================================
          # Paths
          # ============================================================

          COMMON_DIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

          XDP_HEADER="$COMMON_DIR/include/net/xdp.h"
          UDP_HEADER="$COMMON_DIR/include/linux/udp.h"
          BTF_HEADER="$COMMON_DIR/include/linux/btf.h"

          AF_NETLINK_H="$COMMON_DIR/net/netlink/af_netlink.h"

          BTF_EMIT_C="$COMMON_DIR/kernel/btf_xdp_buff_emit.c"
          KERNEL_MAKEFILE="$COMMON_DIR/kernel/Makefile"

          LINK_VMLINUX_SH="$COMMON_DIR/scripts/link-vmlinux.sh"

          RESOLVE_BTFIDS_SRC="$COMMON_DIR/tools/bpf/resolve_btfids/main.c"

          # ============================================================
          # Diagnostic files
          # ============================================================

          BUILD_LOG="$GITHUB_WORKSPACE/kernel-build.log"

          STATUS_FILE="$GITHUB_WORKSPACE/kernel-build-status.txt"

          RESOLVE_BTFIDS_PATCH_FILE="$GITHUB_WORKSPACE/resolve-btfids-patch.txt"

          RESOLVE_BTFIDS_DEBUG_FILE="$GITHUB_WORKSPACE/resolve-btfids-debug.txt"

          BTF_ID_SYMBOLS_FILE="$GITHUB_WORKSPACE/btf-id-symbols.txt"

          BTF_HELPER_DWARF_FILE="$GITHUB_WORKSPACE/btf-helper-dwarf.txt"

          BTF_HELPER_TYPES_FILE="$GITHUB_WORKSPACE/btf-helper-types.txt"

          SAVED_VMLINUX="$GITHUB_WORKSPACE/vmlinux-before-btfids"

          SAVED_BTF_BIN="$GITHUB_WORKSPACE/btf-bin-before-btfids.o"

          SAVED_TMP_BTF="$GITHUB_WORKSPACE/tmp-vmlinux-btf-before-btfids"

          BTF_SANITY_FILE="$GITHUB_WORKSPACE/btf-sanity.txt"

          FINAL_BTF_CHECK="$GITHUB_WORKSPACE/final-vmlinux.btf"

          IMAGE_SANITY_UNPACKED="$GITHUB_WORKSPACE/Image-sanity-unpacked"

          BTF_OBJECT_RAW="$GITHUB_WORKSPACE/btf-object-before-btfids.btf"

          BTF_DEEP_FILE="$GITHUB_WORKSPACE/btf-deep-analysis.txt"

          PAHOLE_RUNTIME_FILE="$GITHUB_WORKSPACE/pahole-runtime.txt"

          # ============================================================
          # Clear old diagnostics
          # ============================================================

          rm -f "$BUILD_LOG"
          rm -f "$STATUS_FILE"

          rm -f "$RESOLVE_BTFIDS_PATCH_FILE"
          rm -f "$RESOLVE_BTFIDS_DEBUG_FILE"

          rm -f "$BTF_ID_SYMBOLS_FILE"

          rm -f "$BTF_HELPER_DWARF_FILE"
          rm -f "$BTF_HELPER_TYPES_FILE"

          rm -f "$SAVED_VMLINUX"
          rm -f "$SAVED_BTF_BIN"
          rm -f "$SAVED_TMP_BTF"

          rm -f "$BTF_SANITY_FILE"
          rm -f "$FINAL_BTF_CHECK"
          rm -f "$IMAGE_SANITY_UNPACKED"
          rm -f "$BTF_OBJECT_RAW"

          rm -f "$BTF_DEEP_FILE"

          rm -f "$PAHOLE_RUNTIME_FILE"

          # ============================================================
          # pahole
          #
          # IMPORTANT:
          # 这里强制使用前一步安装的 /usr/local/bin/pahole v1.27。
          # 不再优先使用 Android prebuilt pahole v1.19。
          #
          # BTF 保持开启；本步骤只切换 BTF encoder/dedup 工具。
          # ============================================================

          echo "=== Detect BTF tool ==="

          PAHOLE_BIN="/usr/local/bin/pahole"

          if [ ! -x "$PAHOLE_BIN" ]; then
            echo "❌ /usr/local/bin/pahole 不存在或不可执行"
            echo "❌ 为避免重新落回 v1.19 并生成巨型 BTF，停止构建"
            exit 1
          fi

          PAHOLE_VERSION=$("$PAHOLE_BIN" --version 2>&1 | head -n 1)

          echo "=== pahole path ==="
          echo "$PAHOLE_BIN"

          echo "=== pahole version ==="
          echo "$PAHOLE_VERSION"

          case "$PAHOLE_VERSION" in
            *v1.27*)
              echo "✅ confirmed pahole v1.27"
              ;;
            *)
              echo "❌ 不是预期的 pahole v1.27: $PAHOLE_VERSION"
              exit 1
              ;;
          esac

          export PAHOLE="$PAHOLE_BIN"

          # ============================================================
          # Required files
          # ============================================================

          echo "=== Check required files ==="

          for REQUIRED_FILE in \
            "$XDP_HEADER" \
            "$UDP_HEADER" \
            "$BTF_HEADER" \
            "$AF_NETLINK_H" \
            "$KERNEL_MAKEFILE" \
            "$LINK_VMLINUX_SH" \
            "$RESOLVE_BTFIDS_SRC"
          do

            if [ ! -f "$REQUIRED_FILE" ]; then

              echo "❌ 找不到必要文件:"

              echo "$REQUIRED_FILE"

              exit 1

            fi

          done

          # ============================================================
          # xdp_buff
          # ============================================================

          echo "=== Check struct xdp_buff ==="

          if ! grep -qE \
            'struct[[:space:]]+xdp_buff[[:space:]]*\{' \
            "$XDP_HEADER"; then

            echo "❌ 找不到 struct xdp_buff"

            exit 1

          fi

          # ============================================================
          # udp_sock
          # ============================================================

          echo "=== Check struct udp_sock ==="

          if ! grep -qE \
            'struct[[:space:]]+udp_sock[[:space:]]*\{' \
            "$UDP_HEADER"; then

            echo "❌ 找不到 struct udp_sock"

            exit 1

          fi

          # ============================================================
          # udp6_sock
          # ============================================================

          echo "=== Search struct udp6_sock ==="

          UDP6_HEADER=$(grep -RslE \
            'struct[[:space:]]+udp6_sock[[:space:]]*\{' \
            "$COMMON_DIR/include" \
            2>/dev/null \
            | head -n 1)

          if [ -z "$UDP6_HEADER" ]; then

            echo "❌ 找不到 struct udp6_sock"

            exit 1

          fi

          UDP6_HEADER_REL="${UDP6_HEADER#$COMMON_DIR/include/}"

          # ============================================================
          # tcp_timewait_sock
          # ============================================================

          echo "=== Search struct tcp_timewait_sock ==="

          TCP_TW_HEADER=$(grep -RslE \
            'struct[[:space:]]+tcp_timewait_sock[[:space:]]*\{' \
            "$COMMON_DIR/include" \
            2>/dev/null \
            | head -n 1)

          if [ -z "$TCP_TW_HEADER" ]; then

            echo "❌ 找不到 struct tcp_timewait_sock"

            exit 1

          fi

          TCP_TW_HEADER_REL="${TCP_TW_HEADER#$COMMON_DIR/include/}"

          # ============================================================
          # tcp_sock
          # ============================================================

          echo "=== Check struct tcp_sock ==="

          if ! grep -qE \
            'struct[[:space:]]+tcp_sock[[:space:]]*\{' \
            "$TCP_TW_HEADER"; then

            echo "❌ 找不到 struct tcp_sock"

            exit 1

          fi

          # ============================================================
          # tcp_request_sock
          # ============================================================

          echo "=== Search struct tcp_request_sock ==="

          TCP_REQ_HEADER=$(grep -RslE \
            'struct[[:space:]]+tcp_request_sock[[:space:]]*\{' \
            "$COMMON_DIR/include" \
            2>/dev/null \
            | head -n 1)

          if [ -z "$TCP_REQ_HEADER" ]; then

            echo "❌ 找不到 struct tcp_request_sock"

            exit 1

          fi

          TCP_REQ_HEADER_REL="${TCP_REQ_HEADER#$COMMON_DIR/include/}"

          # ============================================================
          # tcp6_sock
          # ============================================================

          echo "=== Search struct tcp6_sock ==="

          TCP6_HEADER=$(grep -RslE \
            'struct[[:space:]]+tcp6_sock[[:space:]]*\{' \
            "$COMMON_DIR/include" \
            2>/dev/null \
            | head -n 1)

          if [ -z "$TCP6_HEADER" ]; then

            echo "❌ 找不到 struct tcp6_sock"

            exit 1

          fi

          TCP6_HEADER_REL="${TCP6_HEADER#$COMMON_DIR/include/}"

          # ============================================================
          # netlink_sock
          # ============================================================

          echo "=== Check struct netlink_sock ==="

          if ! grep -qE \
            'struct[[:space:]]+netlink_sock[[:space:]]*\{' \
            "$AF_NETLINK_H"; then

            echo "❌ 找不到 struct netlink_sock"

            exit 1

          fi

          echo "✅ xdp_buff"

          echo "✅ udp_sock"

          echo "✅ udp6_sock -> $UDP6_HEADER_REL"

          echo "✅ tcp_timewait_sock -> $TCP_TW_HEADER_REL"

          echo "✅ tcp_sock"

          echo "✅ tcp_request_sock -> $TCP_REQ_HEADER_REL"

          echo "✅ tcp6_sock -> $TCP6_HEADER_REL"

          echo "✅ netlink_sock -> net/netlink/af_netlink.h"

          # ============================================================
          # Unified BTF helper
          # ============================================================

          echo "=== Create unified BTF helper ==="

          cat > "$BTF_EMIT_C" <<EOF
          // SPDX-License-Identifier: GPL-2.0
          /*
           * Unified DWARF/BTF type retention helper.
           *
           * This translation unit is compiled with:
           *
           *   -fstandalone-debug
           *
           * and without:
           *
           *   \$(CC_FLAGS_LTO)
           */

          #include <linux/compiler.h>

          struct seq_file;
          struct bpf_prog;

          #include <linux/btf.h>

          #include <net/xdp.h>
          #include <linux/udp.h>
          #include <${UDP6_HEADER_REL}>
          #include <${TCP_TW_HEADER_REL}>
          #include <${TCP_REQ_HEADER_REL}>
          #include <${TCP6_HEADER_REL}>

          #include "../net/netlink/af_netlink.h"

          static __used noinline void
          btf_force_emit_required_types(void)
          {
              BTF_TYPE_EMIT(struct xdp_buff);

              BTF_TYPE_EMIT(struct udp_sock);
              BTF_TYPE_EMIT(struct udp6_sock);

              BTF_TYPE_EMIT(struct tcp_timewait_sock);
              BTF_TYPE_EMIT(struct tcp_sock);
              BTF_TYPE_EMIT(struct tcp_request_sock);
              BTF_TYPE_EMIT(struct tcp6_sock);

              BTF_TYPE_EMIT(struct netlink_sock);
          }
          EOF

          echo "=== Unified helper source ==="

          cat "$BTF_EMIT_C"

          # ============================================================
          # kernel/Makefile
          # ============================================================

          echo "=== Configure unified helper Makefile ==="

          sed -i \
            '/CFLAGS_btf_xdp_buff_emit\.o[[:space:]]*+=[[:space:]]*-fstandalone-debug/d' \
            "$KERNEL_MAKEFILE"

          sed -i \
            '/CFLAGS_REMOVE_btf_xdp_buff_emit\.o[[:space:]]*+=[[:space:]]*$(CC_FLAGS_LTO)/d' \
            "$KERNEL_MAKEFILE"

          if ! grep -qF \
            'obj-$(CONFIG_DEBUG_INFO_BTF) += btf_xdp_buff_emit.o' \
            "$KERNEL_MAKEFILE"; then

            echo "" \
              >> "$KERNEL_MAKEFILE"

            echo \
              '# Unified required networking BTF types' \
              >> "$KERNEL_MAKEFILE"

            echo \
              'obj-$(CONFIG_DEBUG_INFO_BTF) += btf_xdp_buff_emit.o' \
              >> "$KERNEL_MAKEFILE"

          fi

          echo \
            'CFLAGS_btf_xdp_buff_emit.o += -fstandalone-debug' \
            >> "$KERNEL_MAKEFILE"

          echo \
            'CFLAGS_REMOVE_btf_xdp_buff_emit.o += $(CC_FLAGS_LTO)' \
            >> "$KERNEL_MAKEFILE"

          echo "=== Verify helper Makefile ==="

          grep -nE \
            'btf_xdp_buff_emit|CFLAGS_REMOVE_btf_xdp_buff_emit' \
            "$KERNEL_MAKEFILE" \
            || true

          if ! grep -qF \
            'obj-$(CONFIG_DEBUG_INFO_BTF) += btf_xdp_buff_emit.o' \
            "$KERNEL_MAKEFILE"; then

            echo "❌ helper object missing from Makefile"

            exit 1

          fi

          if ! grep -qF \
            'CFLAGS_btf_xdp_buff_emit.o += -fstandalone-debug' \
            "$KERNEL_MAKEFILE"; then

            echo "❌ helper standalone-debug missing"

            exit 1

          fi

          if ! grep -qF \
            'CFLAGS_REMOVE_btf_xdp_buff_emit.o += $(CC_FLAGS_LTO)' \
            "$KERNEL_MAKEFILE"; then

            echo "❌ helper LTO removal missing"

            exit 1

          fi

          for TYPE in \
            xdp_buff \
            udp_sock \
            udp6_sock \
            tcp_timewait_sock \
            tcp_sock \
            tcp_request_sock \
            tcp6_sock \
            netlink_sock
          do

            if ! grep -qF \
              "BTF_TYPE_EMIT(struct $TYPE);" \
              "$BTF_EMIT_C"; then

              echo "❌ helper missing struct $TYPE"

              exit 1

            fi

          done

          echo "✅ unified helper configured"

          # ============================================================
          # PATCH resolve_btfids
          #
          # 保留原来的：
          #
          #   btf_is_struct(type) && nr_structs
          #
          # 等 gating。
          #
          # 只修复：
          #
          #   同一个 requested symbol 被重复 BTF type 再次命中时，
          #   不应该再次执行 (*nr)--。
          #
          # 使用正则，不依赖 Tab / spaces。
          # ============================================================

          echo "=== Patch resolve_btfids duplicate-safe resolver ==="

          python3 - "$RESOLVE_BTFIDS_SRC" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          marker = "BTF_DUPLICATE_SAFE_RESOLVE_PATCH"

          # ============================================================
          # 如果已经 patch，直接退出。
          # ============================================================

          if marker in text:

              print(
                  "✅ resolve_btfids patch already exists"
              )

              sys.exit(0)

          # ============================================================
          # 匹配真实源码：
          #
          #   id = btf_id__find(root, str);
          #   if (id) {
          #       id->id = type_id;
          #       (*nr)--;
          #   }
          #
          # 缩进允许任意 Tab / spaces。
          # ============================================================

          pattern = re.compile(
              r'^(?P<indent>[ \t]*)'
              r'id = btf_id__find\(root, str\);[ \t]*\n'

              r'(?P=indent)'
              r'if \(id\) \{[ \t]*\n'

              r'(?P<inner>[ \t]+)'
              r'id->id = type_id;[ \t]*\n'

              r'(?P=inner)'
              r'\(\*nr\)--;[ \t]*\n'

              r'(?P=indent)'
              r'\}[ \t]*$',

              re.MULTILINE,
          )

          matches = list(
              pattern.finditer(text)
          )

          if len(matches) != 1:

              print("")
              print(
                  "ERROR: could not uniquely match "
                  "btf_id__find resolve block"
              )

              print(
                  f"regex matches={len(matches)}"
              )

              print("")
              print(
                  "=== nearby source ==="
              )

              lines = text.splitlines()

              for number, line in enumerate(
                  lines,
                  1
              ):

                  if (
                      "btf_id__find(root, str)"
                      in line
                  ):

                      start = max(
                          0,
                          number - 15
                      )

                      end = min(
                          len(lines),
                          number + 20
                      )

                      for index in range(
                          start,
                          end
                      ):

                          print(
                              f"{index + 1}: "
                              f"{lines[index]!r}"
                          )

              sys.exit(1)

          match = matches[0]

          indent = match.group(
              "indent"
          )

          inner = match.group(
              "inner"
          )

          # 在 inner 基础上再增加一级缩进。
          if "\t" in inner:

              deeper = inner + "\t"

          else:

              deeper = inner + "    "

          replacement = (
              f"{indent}"
              "id = btf_id__find(root, str);\n"

              "\n"

              f"{indent}"
              "/*\n"

              f"{indent}"
              " * BTF_DUPLICATE_SAFE_RESOLVE_PATCH\n"

              f"{indent}"
              " *\n"

              f"{indent}"
              " * Multiple BTF records may have the same\n"

              f"{indent}"
              " * requested name/kind. Resolve and decrement\n"

              f"{indent}"
              " * the remaining counter only once.\n"

              f"{indent}"
              " */\n"

              f"{indent}"
              "if (id && !id->id) {\n"

              f"{inner}"
              "id->id = type_id;\n"

              "\n"

              f"{inner}"
              "if (*nr > 0)\n"

              f"{deeper}"
              "(*nr)--;\n"

              "\n"

              f"{inner}"
              "if (!strcmp(id->name, \"tcp6_sock\") ||\n"

              f"{deeper}"
              "!strcmp(id->name, \"netlink_sock\"))\n"

              f"{deeper}"
              "pr_err(\"BTFDBG resolved %s -> %d "
              "remaining=%d\\n\",\n"

              f"{deeper}"
              "       id->name, type_id, *nr);\n"

              f"{indent}"
              "} else if (id && id->id) {\n"

              f"{inner}"
              "if (!strcmp(id->name, \"tcp6_sock\") ||\n"

              f"{deeper}"
              "!strcmp(id->name, \"netlink_sock\"))\n"

              f"{deeper}"
              "pr_err(\"BTFDBG duplicate %s keep=%d "
              "ignore=%d remaining=%d\\n\",\n"

              f"{deeper}"
              "       id->name, id->id, "
              "type_id, *nr);\n"

              f"{indent}"
              "}"
          )

          # 使用 lambda，避免 re.sub 对 replacement 中的
          # \n 再做一次转义解析。
          text, replace_count = pattern.subn(
              lambda unused_match: replacement,
              text,
              count=1,
          )

          if replace_count != 1:

              print(
                  "ERROR: resolve block replacement failed"
              )

              sys.exit(1)

          # ============================================================
          # 修改结果验证
          # ============================================================

          required = [
              "BTF_DUPLICATE_SAFE_RESOLVE_PATCH",

              "if (id && !id->id)",

              'BTFDBG resolved %s -> %d remaining=%d',

              'BTFDBG duplicate %s keep=%d ignore=%d remaining=%d',
          ]

          for item in required:

              if item not in text:

                  print(
                      "ERROR: patched source missing:"
                  )

                  print(
                      item
                  )

                  sys.exit(1)

          # 原始 block 不应再存在。
          old_pattern = re.compile(
              r'id = btf_id__find\(root, str\);'
              r'[ \t]*\n'
              r'[ \t]*if \(id\) \{'
              r'[ \t]*\n'
              r'[ \t]*id->id = type_id;'
              r'[ \t]*\n'
              r'[ \t]*\(\*nr\)--;'
          )

          if old_pattern.search(text):

              print(
                  "ERROR: old duplicate-unsafe block "
                  "still exists"
              )

              sys.exit(1)

          # ============================================================
          # 保证这一版没有取消原来的 gating。
          # ============================================================

          gating = [
              "btf_is_func(type) && nr_funcs",
              "btf_is_struct(type) && nr_structs",
              "btf_is_union(type) && nr_unions",
              "btf_is_typedef(type) && nr_typedefs",
          ]

          for item in gating:

              if item not in text:

                  print(
                      "ERROR: original kind gating missing:"
                  )

                  print(
                      item
                  )

                  sys.exit(1)

          # ============================================================
          # 所有验证成功后才写回。
          # ============================================================

          path.write_text(
              text
          )

          print(
              "✅ resolve_btfids duplicate-safe patch applied"
          )

          print("")
          print(
              "=== Patched block ==="
          )

          patched_lines = text.splitlines()

          for number, line in enumerate(
              patched_lines,
              1
          ):

              if marker in line:

                  start = max(
                      0,
                      number - 15
                  )

                  end = min(
                      len(patched_lines),
                      number + 45
                  )

                  for index in range(
                      start,
                      end
                  ):

                      print(
                          f"{index + 1}: "
                          f"{patched_lines[index]}"
                      )

                  break
          PY

          # ============================================================
          # Force resolve_btfids rebuild
          # ============================================================

          touch "$RESOLVE_BTFIDS_SRC"

          echo "=== Remove stale resolve_btfids build outputs ==="

          find \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/out" \
            -type f \
            \( \
              -path '*/tools/bpf/resolve_btfids/resolve_btfids' \
              -o \
              -path '*/tools/bpf/resolve_btfids/main.o' \
            \) \
            -print \
            -delete \
            2>/dev/null \
            || true

          # ============================================================
          # Verify resolver source
          # ============================================================

          echo "=== Verify resolve_btfids patch ==="

          {
            echo "=== resolve_btfids patch verification ==="
            echo ""

            grep -n \
              -B 30 \
              -A 65 \
              'BTF_DUPLICATE_SAFE_RESOLVE_PATCH' \
              "$RESOLVE_BTFIDS_SRC" \
              || true

            echo ""

            echo "=== Original kind gating ==="

            grep -nE \
              'btf_is_(func|struct|union|typedef)\(type\)' \
              "$RESOLVE_BTFIDS_SRC" \
              | head -n 50 \
              || true

            echo ""

            echo "=== BTFDBG source ==="

            grep -n \
              -B 15 \
              -A 25 \
              'BTFDBG' \
              "$RESOLVE_BTFIDS_SRC" \
              || true

          } | tee "$RESOLVE_BTFIDS_PATCH_FILE"

          if ! grep -qF \
            'BTF_DUPLICATE_SAFE_RESOLVE_PATCH' \
            "$RESOLVE_BTFIDS_SRC"; then

            echo "❌ patch marker missing"

            exit 1

          fi

          if ! grep -qF \
            'if (id && !id->id)' \
            "$RESOLVE_BTFIDS_SRC"; then

            echo "❌ duplicate-safe guard missing"

            exit 1

          fi

          if ! grep -qF \
            'btf_is_struct(type) && nr_structs' \
            "$RESOLVE_BTFIDS_SRC"; then

            echo "❌ original nr_structs gating unexpectedly missing"

            exit 1

          fi

          if ! grep -qF \
            'btf_is_func(type) && nr_funcs' \
            "$RESOLVE_BTFIDS_SRC"; then

            echo "❌ original nr_funcs gating unexpectedly missing"

            exit 1

          fi

          echo "✅ resolve_btfids patch verified"

          # ============================================================
          # Host build tools
          # ============================================================

          echo "=== Fix host build tools ==="

          BUILD_TOOLS_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/build-tools/path/linux-x86"

          mkdir -p "$BUILD_TOOLS_BIN"

          LLD_BIN=$(find \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" \
            -type f \
            -path "*/clang/host/linux-x86/*/bin/ld.lld" \
            -perm -111 \
            2>/dev/null \
            | head -n 1)

          if [ -z "$LLD_BIN" ]; then

            echo "❌ 找不到 Android Clang ld.lld"

            exit 1

          fi

          echo "✅ Android ld.lld:"

          echo "$LLD_BIN"

          ln -sf \
            "$LLD_BIN" \
            "$BUILD_TOOLS_BIN/ld"

          if [ ! -x /usr/bin/dd ]; then

            echo "❌ /usr/bin/dd 不存在"

            exit 1

          fi

          ln -sf \
            /usr/bin/dd \
            "$BUILD_TOOLS_BIN/dd"

          if [ ! -x /usr/bin/printf ]; then

            echo "❌ /usr/bin/printf 不存在"

            exit 1

          fi

          ln -sf \
            /usr/bin/printf \
            "$BUILD_TOOLS_BIN/printf"

          echo "=== Host tool aliases ==="

          ls -l \
            "$BUILD_TOOLS_BIN/ld" \
            "$BUILD_TOOLS_BIN/dd" \
            "$BUILD_TOOLS_BIN/printf"

          echo "=== ld.lld version ==="

          "$BUILD_TOOLS_BIN/ld" \
            --version \
            | head -n 1

          # ============================================================
          # llvm-nm
          # ============================================================

          LLVM_NM_BIN=$(find \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" \
            -type f \
            -path "*/clang/host/linux-x86/*/bin/llvm-nm" \
            -perm -111 \
            2>/dev/null \
            | head -n 1)

          if [ -z "$LLVM_NM_BIN" ] && \
             [ -x /usr/bin/nm ]; then

            LLVM_NM_BIN="/usr/bin/nm"

          fi

          echo "=== nm ==="

          echo "${LLVM_NM_BIN:-未找到}"

          # ============================================================
          # llvm-objcopy
          # ============================================================

          LLVM_OBJCOPY_BIN=$(find \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" \
            -type f \
            -path "*/clang/host/linux-x86/*/bin/llvm-objcopy" \
            -perm -111 \
            2>/dev/null \
            | head -n 1)

          echo "=== llvm-objcopy ==="
          echo "${LLVM_OBJCOPY_BIN:-未找到}"

          if [ -z "$LLVM_OBJCOPY_BIN" ] || \
             [ ! -x "$LLVM_OBJCOPY_BIN" ]; then
            echo "❌ 找不到 Android llvm-objcopy"
            exit 1
          fi

          # ============================================================
          # Instrument the real pahole invocation inside link-vmlinux.sh
          #
          # 目的：确认 BTF 阶段实际执行的 pahole 路径、版本、环境变量
          # 以及完整展开后的命令。不会修改 pahole 参数本身。
          # ============================================================

          echo "=== Instrument runtime pahole invocation ==="

          python3 - "$LINK_VMLINUX_SH" <<'PY'
          import shlex
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = "BTF_DIAG_PAHOLE_RUNTIME"

          if marker in text:
              print("✅ runtime pahole instrumentation already exists")
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)
          candidates = []

          for i, line in enumerate(lines):
              stripped = line.strip()

              if not stripped or stripped.startswith("#"):
                  continue

              if "PAHOLE" not in stripped:
                  continue

              if "--version" in stripped:
                  continue

              if "-J" in stripped or "btf_encode" in stripped:
                  candidates.append(i)

          if not candidates:
              print("⚠️ 没找到明确的 pahole BTF encode 命令")
              print("=== PAHOLE related source lines ===")
              for n, line in enumerate(lines, 1):
                  if "PAHOLE" in line or "pahole" in line:
                      print(f"{n}: {line.rstrip()}")
              raise SystemExit(0)

          start = candidates[0]
          end = start

          # 收完整的反斜杠续行命令。
          while end < len(lines) - 1 and lines[end].rstrip().endswith("\\"):
              end += 1

          source_cmd = " ".join(
              part.strip().rstrip("\\").strip()
              for part in lines[start:end + 1]
          )

          indent = lines[start][
              :len(lines[start]) - len(lines[start].lstrip())
          ]

          quoted_source = shlex.quote(source_cmd)

          before = [
              indent + "# BTF_DIAG_PAHOLE_RUNTIME\n",
              indent + 'echo "BTFDIAG PAHOLE_RUNTIME_PATH=${PAHOLE}" >&2\n',
              indent + 'echo "BTFDIAG PAHOLE_RUNTIME_VERSION=$(${PAHOLE} --version 2>&1 | head -n 1)" >&2\n',
              indent + 'echo "BTFDIAG PAHOLE_FLAGS=${PAHOLE_FLAGS:-<unset>}" >&2\n',
              indent + 'echo "BTFDIAG OBJCOPY=${OBJCOPY:-<unset>}" >&2\n',
              indent + f"echo BTFDIAG_PAHOLE_SOURCE={quoted_source} >&2\n",
              indent + 'if [ -n "${GITHUB_WORKSPACE:-}" ]; then\n',
              indent + '    {\n',
              indent + '        echo "PAHOLE_RUNTIME_PATH=${PAHOLE}"\n',
              indent + '        echo "PAHOLE_RUNTIME_VERSION=$(${PAHOLE} --version 2>&1 | head -n 1)"\n',
              indent + '        echo "PAHOLE_FLAGS=${PAHOLE_FLAGS:-<unset>}"\n',
              indent + '        echo "OBJCOPY=${OBJCOPY:-<unset>}"\n',
              indent + f"        echo PAHOLE_SOURCE={quoted_source}\n",
              indent + '    } >> "${GITHUB_WORKSPACE}/pahole-runtime.txt"\n',
              indent + 'fi\n',
              indent + 'set -x\n',
          ]

          after = [
              indent + 'set +x\n',
          ]

          lines[start:start] = before
          end += len(before)
          lines[end + 1:end + 1] = after

          path.write_text("".join(lines))

          print("✅ runtime pahole instrumentation applied")
          print(f"source command: {source_cmd}")
          PY

          echo "=== Verify runtime pahole instrumentation ==="

          grep -n \
            -B 8 \
            -A 30 \
            'BTF_DIAG_PAHOLE_RUNTIME' \
            "$LINK_VMLINUX_SH" \
            || true

          # ============================================================
          # Patch link-vmlinux.sh
          #
          # 在真正 ${RESOLVE_BTFIDS} vmlinux 之前保存：
          #
          #   vmlinux
          #   .btf.vmlinux.bin.o
          #   .tmp_vmlinux.btf
          #
          # 不使用 sync。
          # ============================================================

          echo "=== Patch link-vmlinux.sh diagnostic save ==="

          python3 - "$LINK_VMLINUX_SH" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          marker = "BTF_DIAG_SAVE_VMLINUX"

          # ============================================================
          # 删除旧 diagnostic block。
          # ============================================================

          if marker in text:

              lines = text.splitlines(
                  keepends=True
              )

              start = None
              end = None

              for index, line in enumerate(
                  lines
              ):

                  if marker in line:

                      start = index
                      break

              if start is not None:

                  for index in range(
                      start,
                      len(lines)
                  ):

                      stripped = lines[
                          index
                      ].strip()

                      if (
                          "RESOLVE_BTFIDS"
                          in stripped
                          and "vmlinux"
                          in stripped
                      ):

                          end = index
                          break

                  if end is None:

                      print(
                          "ERROR: old diagnostic block "
                          "has no RESOLVE_BTFIDS line"
                      )

                      sys.exit(1)

                  # 保留真正的 RESOLVE_BTFIDS 行。
                  del lines[
                      start:end
                  ]

                  text = "".join(
                      lines
                  )

          # ============================================================
          # 找真正的 resolve_btfids 执行行。
          # ============================================================

          lines = text.splitlines(
              keepends=True
          )

          target = None

          for index, line in enumerate(
              lines
          ):

              stripped = line.strip()

              if stripped.startswith("#"):

                  continue

              if (
                  "RESOLVE_BTFIDS"
                  in stripped
                  and "vmlinux"
                  in stripped
              ):

                  target = index
                  break

          if target is None:

              print(
                  "ERROR: RESOLVE_BTFIDS vmlinux "
                  "not found"
              )

              print("")
              print(
                  "=== related lines ==="
              )

              for number, line in enumerate(
                  text.splitlines(),
                  1
              ):

                  if (
                      "RESOLVE_BTFIDS"
                      in line
                      or "resolve_btfids"
                      in line
                  ):

                      print(
                          f"{number}: {line}"
                      )

              sys.exit(1)

          original = lines[
              target
          ]

          indent = original[
              :len(original)
              - len(original.lstrip())
          ]

          block = [
              indent
              + "# BTF_DIAG_SAVE_VMLINUX\n",

              indent
              + 'echo "  SAVEBTF vmlinux-before-btfids"\n',

              indent
              + 'if [ -n "${GITHUB_WORKSPACE:-}" ]; then\n',

              indent
              + '    cp -f vmlinux '
                '"${GITHUB_WORKSPACE}/'
                'vmlinux-before-btfids"\n',

              indent
              + '    if [ -f .btf.vmlinux.bin.o ]; then\n',

              indent
              + '        cp -f .btf.vmlinux.bin.o '
                '"${GITHUB_WORKSPACE}/'
                'btf-bin-before-btfids.o"\n',

              indent
              + '    fi\n',

              indent
              + '    if [ -f .tmp_vmlinux.btf ]; then\n',

              indent
              + '        cp -f .tmp_vmlinux.btf '
                '"${GITHUB_WORKSPACE}/'
                'tmp-vmlinux-btf-before-btfids"\n',

              indent
              + '    fi\n',

              indent
              + 'fi\n',
          ]

          lines[
              target:target
          ] = block

          path.write_text(
              "".join(lines)
          )

          print(
              "✅ link-vmlinux diagnostic patch applied"
          )
          PY

          echo "=== Verify link-vmlinux.sh diagnostic patch ==="

          grep -n \
            -B 10 \
            -A 35 \
            'BTF_DIAG_SAVE_VMLINUX' \
            "$LINK_VMLINUX_SH" \
            || true

          if ! grep -qF \
            'BTF_DIAG_SAVE_VMLINUX' \
            "$LINK_VMLINUX_SH"; then

            echo "❌ link-vmlinux diagnostic patch failed"

            exit 1

          fi

          if grep -A 30 \
            'BTF_DIAG_SAVE_VMLINUX' \
            "$LINK_VMLINUX_SH" \
            | grep -qE \
              '^[[:space:]]*sync([[:space:]]|$)'; then

            echo "❌ diagnostic block 中仍存在 sync"

            exit 1

          fi

          # ============================================================
          # Build
          # ============================================================

          echo "=== 开始内核编译 ==="

          echo "CPUD=$CPUD"

          echo "BUILD_METHOD=$BUILD_METHOD"

          echo "PAHOLE=$PAHOLE_BIN"

          echo "LOG=$BUILD_LOG"

          # ============================================================
          # Force pahole as a GNU make command-line override
          #
          # IMPORTANT:
          #
          # Passing PAHOLE=/usr/local/bin/pahole only as a normal
          # environment variable is NOT enough here. This 5.10 tree
          # assigns PAHOLE=pahole inside Kbuild, which overrides the
          # ordinary environment value.
          #
          # MAKEFLAGS variable assignments are treated by GNU make as
          # command-line overrides, so the internal make and sub-makes
          # keep the absolute v1.27 path.
          # ============================================================

          if [ -n "${MAKEFLAGS:-}" ]; then

            export MAKEFLAGS="$MAKEFLAGS PAHOLE=$PAHOLE_BIN"

          else

            export MAKEFLAGS="PAHOLE=$PAHOLE_BIN"

          fi

          echo "=== GNU make pahole override ==="

          echo "MAKEFLAGS=$MAKEFLAGS"

          case " $MAKEFLAGS " in

            *" PAHOLE=$PAHOLE_BIN "*)

              echo "✅ MAKEFLAGS contains absolute pahole override"

              ;;

            *)

              echo "❌ MAKEFLAGS pahole override missing"

              exit 1

              ;;

          esac

          set +e

          if [ -f ./kernel_platform/build_with_bazel.py ]; then

            (
              ./kernel_platform/oplus/bazel/oplus_modules_variant.sh \
                "$CPUD" \
                "$BUILD_METHOD"

              MODULE_STATUS=$?

              if [ "$MODULE_STATUS" -eq 0 ]; then

                PAHOLE="$PAHOLE_BIN" \
                  ./kernel_platform/build_with_bazel.py \
                  -t "$CPUD" \
                  "$BUILD_METHOD"

              else

                echo "❌ oplus_modules_variant.sh failed"

                exit "$MODULE_STATUS"

              fi

            ) > "$BUILD_LOG" 2>&1

            BUILD_STATUS=$?

          else

            PAHOLE="$PAHOLE_BIN" \
            LTO=thin \
            SYSTEM_DLKM_RE_SIGN=0 \
            BUILD_SYSTEM_DLKM=0 \
            KMI_SYMBOL_LIST_STRICT_MODE=0 \
              ./kernel_platform/oplus/build/oplus_build_kernel.sh \
              "$CPUD" \
              "$BUILD_METHOD" \
              > "$BUILD_LOG" 2>&1

            BUILD_STATUS=$?

          fi

          set -e

          echo "$BUILD_STATUS" \
            > "$STATUS_FILE"

          echo "=== 官方构建脚本退出码 ==="

          echo "$BUILD_STATUS"

          # ============================================================
          # Confirm resolve_btfids rebuilt
          # ============================================================

          echo "=== resolve_btfids compile/rebuild lines ==="

          grep -nEi \
            'resolve_btfids|HOSTCC.*main\.o|HOSTLD.*resolve_btfids' \
            "$BUILD_LOG" \
            | tail -n 250 \
            || true

          # ============================================================
          # BTFDBG
          # ============================================================

          echo "=== resolve_btfids BTFDBG ==="

          grep -n \
            'BTFDBG' \
            "$BUILD_LOG" \
            | tail -n 300 \
            || true

          # ============================================================
          # BTFIDS runtime
          # ============================================================

          echo "=== Runtime BTFIDS ==="

          grep -nE \
            'LD +\.tmp_vmlinux\.btf|BTF +\.btf\.vmlinux\.bin\.o|LD +vmlinux|BTFIDS +vmlinux|SAVEBTF|BTFDBG|FAILED unresolved symbol|SORTTAB|SYSMAP|OBJCOPY|Image' \
            "$BUILD_LOG" \
            | tail -n 500 \
            || true

          # ============================================================
          # Kernel output directory
          # ============================================================

          KERNEL_OUT=$(find \
            ./kernel_platform/out \
            -type d \
            -path '*/gki_kernel/common' \
            2>/dev/null \
            | head -n 1)

          echo "=== Kernel out directory ==="

          echo "${KERNEL_OUT:-未找到}"

          # ============================================================
          # Helper object diagnostics
          # ============================================================

          BTF_HELPER_O=""

          if [ -n "$KERNEL_OUT" ]; then

            BTF_HELPER_O=$(find \
              "$KERNEL_OUT" \
              -type f \
              -path '*/kernel/btf_xdp_buff_emit.o' \
              2>/dev/null \
              | head -n 1)

          fi

          echo "=== helper object ==="

          echo "${BTF_HELPER_O:-未找到}"

          if [ -n "$BTF_HELPER_O" ]; then

            file "$BTF_HELPER_O" \
              || true

            readelf \
              --debug-dump=info \
              "$BTF_HELPER_O" \
              > "$BTF_HELPER_DWARF_FILE" \
              2>/dev/null \
              || true

            rm -f "$BTF_HELPER_TYPES_FILE"

            for TYPE in \
              xdp_buff \
              udp_sock \
              udp6_sock \
              tcp_timewait_sock \
              tcp_sock \
              tcp_request_sock \
              tcp6_sock \
              netlink_sock
            do

              echo \
                "===== struct $TYPE =====" \
                >> "$BTF_HELPER_TYPES_FILE"

              grep -n \
                -B 5 \
                -A 10 \
                "$TYPE" \
                "$BTF_HELPER_DWARF_FILE" \
                | head -n 60 \
                >> "$BTF_HELPER_TYPES_FILE" \
                || true

            done

          fi

          # ============================================================
          # Saved vmlinux / BTF sections
          # ============================================================

          if [ -f "$SAVED_VMLINUX" ]; then

            echo "=== Saved vmlinux ==="

            ls -lh \
              "$SAVED_VMLINUX" \
              || true

            file \
              "$SAVED_VMLINUX" \
              || true

            echo "=== Saved vmlinux BTF sections ==="

            readelf -S \
              "$SAVED_VMLINUX" \
              2>/dev/null \
              | grep -E \
                '\.BTF|\.BTF_ids' \
              || true

          fi

          if [ -f "$SAVED_BTF_BIN" ]; then

            echo "=== Saved BTF object ==="

            ls -lh \
              "$SAVED_BTF_BIN" \
              || true

            file \
              "$SAVED_BTF_BIN" \
              || true

          fi

          if [ -f "$SAVED_TMP_BTF" ]; then

            echo "=== Saved tmp vmlinux BTF ==="

            ls -lh \
              "$SAVED_TMP_BTF" \
              || true

          fi

          # ============================================================
          # BTF ID symbols
          # ============================================================

          if [ -f "$SAVED_VMLINUX" ]; then

            {
              echo "=== __BTF_ID__ target symbols ==="
              echo ""

              readelf -sW \
                "$SAVED_VMLINUX" \
                2>/dev/null \
                | grep -E \
                  '__BTF_ID__.*(xdp_buff|udp_sock|udp6_sock|tcp_timewait_sock|tcp_sock|tcp_request_sock|tcp6_sock|netlink_sock)' \
                || true

              echo ""

              if [ -n "$LLVM_NM_BIN" ]; then

                echo "=== nm target symbols ==="

                "$LLVM_NM_BIN" \
                  -a \
                  -n \
                  "$SAVED_VMLINUX" \
                  2>/dev/null \
                  | grep -E \
                    '__BTF_ID__.*(xdp_buff|udp_sock|udp6_sock|tcp_timewait_sock|tcp_sock|tcp_request_sock|tcp6_sock|netlink_sock)' \
                  || true

              fi

            } | tee "$BTF_ID_SYMBOLS_FILE"

          fi

          # ============================================================
          # resolve_btfids binary/source diagnostics
          # ============================================================

          RESOLVE_BTFIDS_BIN=$(find \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/out" \
            -type f \
            -path '*/tools/bpf/resolve_btfids/resolve_btfids' \
            -perm -111 \
            2>/dev/null \
            | head -n 1)

          {
            echo "=== resolve_btfids binary ==="

            echo "${RESOLVE_BTFIDS_BIN:-未找到}"

            echo ""

            if [ -n "$RESOLVE_BTFIDS_BIN" ]; then

              file "$RESOLVE_BTFIDS_BIN" \
                || true

              echo ""

              strings "$RESOLVE_BTFIDS_BIN" \
                | grep -E \
                  'BTFDBG resolved|BTFDBG duplicate|FAILED unresolved symbol' \
                || true

              echo ""

            fi

            echo "=== patched source ==="

            grep -n \
              -B 35 \
              -A 80 \
              'BTF_DUPLICATE_SAFE_RESOLVE_PATCH' \
              "$RESOLVE_BTFIDS_SRC" \
              || true

            echo ""

            echo "=== symbols_resolve ==="

            grep -n \
              -B 20 \
              -A 140 \
              'static int symbols_resolve' \
              "$RESOLVE_BTFIDS_SRC" \
              || true

          } | tee "$RESOLVE_BTFIDS_DEBUG_FILE"

          # ============================================================
          # Build artifacts
          #
          # 注意：
          # OPPO 外层脚本可能错误返回 0，
          # 所以 Image / Image.lz4 才是最终权威判断。
          # ============================================================

          IMAGE=$(find \
            ./kernel_platform/out \
            -type f \
            -path '*/gki_kernel/common/arch/arm64/boot/Image' \
            2>/dev/null \
            | head -n 1)

          if [ -z "$IMAGE" ]; then
            IMAGE=$(find \
              ./kernel_platform/out \
              -type f \
              -name Image \
              2>/dev/null \
              | head -n 1)
          fi

          IMAGE_LZ4=$(find \
            ./kernel_platform/out \
            -type f \
            -path '*/gki_kernel/common/arch/arm64/boot/Image.lz4' \
            2>/dev/null \
            | head -n 1)

          if [ -z "$IMAGE_LZ4" ]; then
            IMAGE_LZ4=$(find \
              ./kernel_platform/out \
              -type f \
              -name Image.lz4 \
              2>/dev/null \
              | head -n 1)
          fi

          VMLINUX=$(find \
            ./kernel_platform/out \
            -type f \
            -path '*/gki_kernel/common/vmlinux' \
            2>/dev/null \
            | head -n 1)

          if [ -z "$VMLINUX" ]; then
            VMLINUX=$(find \
              ./kernel_platform/out \
              -type f \
              -name vmlinux \
              2>/dev/null \
              | head -n 1)
          fi

          echo "=== 编译产物 ==="

          echo "Image     = ${IMAGE:-未找到}"

          echo "Image.lz4 = ${IMAGE_LZ4:-未找到}"

          echo "vmlinux   = ${VMLINUX:-未找到}"

          # ============================================================
          # Final result
          # ============================================================

          if [ -z "$IMAGE" ] && \
             [ -z "$IMAGE_LZ4" ]; then

            echo ""

            echo "❌ 没有生成 Image / Image.lz4"

            echo "请查看 Show Kernel Build Error"

            exit 1

          fi

          if [ "$BUILD_STATUS" -ne 0 ]; then

            echo ""

            echo "❌ 官方构建脚本退出码:"

            echo "$BUILD_STATUS"

            exit "$BUILD_STATUS"

          fi

          # ============================================================
          # Final Image / BTF deep analysis + safety gate
          #
          # 注意顺序：
          #   1. 先提取并完整分析最终 .BTF
          #   2. 再分析保存的 .btf.vmlinux.bin.o
          #   3. 打印 SHA256 / type count / STRUCT 重复统计
          #   4. 最后统一做安全拦截
          #
          # 所以即使 Image 仍然是 155 MiB，也不会再提前 exit 44
          # 而丢掉真正需要的 BTF 诊断数据。
          # ============================================================

          echo "=== Final Image / BTF deep analysis ==="

          rm -f "$BTF_SANITY_FILE"
          rm -f "$FINAL_BTF_CHECK"
          rm -f "$BTF_OBJECT_RAW"
          rm -f "$BTF_DEEP_FILE"
          rm -f "$IMAGE_SANITY_UNPACKED"

          CHECK_IMAGE="$IMAGE"

          if [ -z "$CHECK_IMAGE" ] || \
             [ ! -f "$CHECK_IMAGE" ]; then

            if [ -n "$IMAGE_LZ4" ] && \
               [ -f "$IMAGE_LZ4" ]; then

              echo "Image 不存在，临时解压 Image.lz4 做安全检查"

              lz4 -d -f \
                "$IMAGE_LZ4" \
                "$IMAGE_SANITY_UNPACKED"

              CHECK_IMAGE="$IMAGE_SANITY_UNPACKED"

            else

              echo "❌ 没有可检查的 Image / Image.lz4"
              exit 1

            fi

          fi

          if [ -z "$VMLINUX" ] || \
             [ ! -f "$VMLINUX" ]; then

            echo "❌ 找不到最终 vmlinux，无法验证 .BTF"
            exit 1

          fi

          MAX_IMAGE_SIZE=$((128 * 1024 * 1024))
          MAX_BTF_SIZE=$((64 * 1024 * 1024))
          MAX_BTF_TYPES=500000

          IMAGE_SIZE=$(stat -c '%s' "$CHECK_IMAGE")

          IMAGE_MIB=$(python3 - "$IMAGE_SIZE" <<'PY'
          import sys
          print(f"{int(sys.argv[1]) / 1024 / 1024:.2f}")
          PY
          )

          echo "Image bytes = $IMAGE_SIZE"
          echo "Image MiB   = $IMAGE_MIB"

          # ============================================================
          # Extract final vmlinux .BTF FIRST — never gate before this.
          # ============================================================

          echo "=== Extract final vmlinux .BTF ==="

          "$LLVM_OBJCOPY_BIN" \
            --dump-section \
            ".BTF=$FINAL_BTF_CHECK" \
            "$VMLINUX"

          if [ ! -s "$FINAL_BTF_CHECK" ]; then

            echo "❌ 最终 vmlinux 中无法提取 .BTF"
            exit 1

          fi

          BTF_SIZE=$(stat -c '%s' "$FINAL_BTF_CHECK")

          BTF_MIB=$(python3 - "$BTF_SIZE" <<'PY'
          import sys
          print(f"{int(sys.argv[1]) / 1024 / 1024:.2f}")
          PY
          )

          echo ".BTF bytes = $BTF_SIZE"
          echo ".BTF MiB   = $BTF_MIB"

          # ============================================================
          # Extract .BTF from saved .btf.vmlinux.bin.o when available.
          # ============================================================

          if [ -f "$SAVED_BTF_BIN" ]; then

            echo "=== Extract .BTF from saved BTF object ==="

            "$LLVM_OBJCOPY_BIN" \
              --dump-section \
              ".BTF=$BTF_OBJECT_RAW" \
              "$SAVED_BTF_BIN" \
              2>/dev/null \
              || true

          fi

          # ============================================================
          # SHA256 / byte comparison.
          # ============================================================

          echo "=== Raw BTF SHA256 ==="

          sha256sum "$FINAL_BTF_CHECK" || true

          if [ -s "$BTF_OBJECT_RAW" ]; then

            sha256sum "$BTF_OBJECT_RAW" || true

            if cmp -s \
              "$FINAL_BTF_CHECK" \
              "$BTF_OBJECT_RAW"; then

              echo "FINAL_VMLINUX_BTF_IDENTICAL_TO_OBJECT=YES"

            else

              echo "FINAL_VMLINUX_BTF_IDENTICAL_TO_OBJECT=NO"

            fi

          else

            echo "BTF_OBJECT_RAW_AVAILABLE=NO"

          fi

          # ============================================================
          # Deep raw BTF parser.
          #
          # Prints:
          # - type count
          # - per-kind counts
          # - total / unique STRUCT names
          # - duplicate STRUCT records
          # - top 40 duplicated STRUCT names
          # - all IDs for our 8 target types
          # ============================================================

          set +e

          python3 - \
            "$FINAL_BTF_CHECK" \
            "$MAX_BTF_TYPES" \
            > "$BTF_DEEP_FILE" \
            2>&1 <<'PY'
          import collections
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          max_types = int(sys.argv[2])

          targets = {
              "xdp_buff",
              "udp_sock",
              "udp6_sock",
              "tcp_timewait_sock",
              "tcp_sock",
              "tcp_request_sock",
              "tcp6_sock",
              "netlink_sock",
          }

          kind_names = {
              0: "UNKN",
              1: "INT",
              2: "PTR",
              3: "ARRAY",
              4: "STRUCT",
              5: "UNION",
              6: "ENUM",
              7: "FWD",
              8: "TYPEDEF",
              9: "VOLATILE",
              10: "CONST",
              11: "RESTRICT",
              12: "FUNC",
              13: "FUNC_PROTO",
              14: "VAR",
              15: "DATASEC",
              16: "FLOAT",
              17: "DECL_TAG",
              18: "TYPE_TAG",
              19: "ENUM64",
          }

          data = path.read_bytes()

          if len(data) < 24:
              print("BTF_ANALYSIS_OK=NO")
              print("ERROR=raw BTF too small")
              raise SystemExit(1)

          if struct.unpack_from("<H", data, 0)[0] == 0xEB9F:
              endian = "<"
          elif struct.unpack_from(">H", data, 0)[0] == 0xEB9F:
              endian = ">"
          else:
              print("BTF_ANALYSIS_OK=NO")
              print("ERROR=invalid BTF magic")
              raise SystemExit(1)

          (
              magic,
              version,
              flags,
              hdr_len,
              type_off,
              type_len,
              str_off,
              str_len,
          ) = struct.unpack_from(endian + "HBBIIIII", data, 0)

          type_start = hdr_len + type_off
          type_end = type_start + type_len
          str_start = hdr_len + str_off
          str_end = str_start + str_len

          if type_end > len(data) or str_end > len(data):
              print("BTF_ANALYSIS_OK=NO")
              print("ERROR=BTF section out of bounds")
              raise SystemExit(1)

          strings = data[str_start:str_end]

          def get_string(offset):
              if offset == 0:
                  return ""
              if offset < 0 or offset >= len(strings):
                  return f"<bad-string-offset:{offset}>"
              end = strings.find(b"\x00", offset)
              if end < 0:
                  end = len(strings)
              return strings[offset:end].decode("utf-8", errors="replace")

          def extra_size(kind, vlen):
              if kind == 1:
                  return 4
              if kind == 3:
                  return 12
              if kind in (4, 5):
                  return 12 * vlen
              if kind == 6:
                  return 8 * vlen
              if kind == 13:
                  return 8 * vlen
              if kind == 14:
                  return 4
              if kind == 15:
                  return 12 * vlen
              if kind == 17:
                  return 4
              if kind == 19:
                  return 12 * vlen
              if kind in (0, 2, 7, 8, 9, 10, 11, 12, 16, 18):
                  return 0
              raise ValueError(f"unsupported BTF kind {kind}")

          kind_counts = collections.Counter()
          struct_names = collections.Counter()
          named_kind_counts = collections.Counter()
          target_hits = collections.defaultdict(list)

          pos = type_start
          type_id = 1

          try:
              while pos < type_end:
                  if pos + 12 > type_end:
                      raise ValueError("truncated btf_type")

                  name_off, info, size_type = struct.unpack_from(
                      endian + "III", data, pos
                  )

                  vlen = info & 0xFFFF
                  kind = (info >> 24) & 0x1F
                  kflag = (info >> 31) & 1
                  name = get_string(name_off)

                  kind_counts[kind] += 1

                  if name:
                      named_kind_counts[(kind, name)] += 1

                  if kind == 4 and name:
                      struct_names[name] += 1

                  if name in targets:
                      target_hits[name].append(
                          (
                              type_id,
                              kind,
                              size_type,
                              vlen,
                              kflag,
                          )
                      )

                  pos += 12 + extra_size(kind, vlen)
                  type_id += 1

          except Exception as exc:
              print("BTF_ANALYSIS_OK=NO")
              print(f"ERROR={exc}")
              raise SystemExit(1)

          if pos != type_end:
              print("BTF_ANALYSIS_OK=NO")
              print(f"ERROR=parser end mismatch pos={pos} type_end={type_end}")
              raise SystemExit(1)

          type_count = type_id - 1
          struct_count = kind_counts.get(4, 0)
          unique_struct_names = len(struct_names)
          duplicate_struct_records = sum(
              count - 1
              for count in struct_names.values()
              if count > 1
          )

          print("=== BTF HEADER ===")
          print(f"FILE={path}")
          print(f"magic=0x{magic:04x}")
          print(f"version={version}")
          print(f"flags={flags}")
          print(f"hdr_len={hdr_len}")
          print(f"type_len={type_len}")
          print(f"str_len={str_len}")
          print(f"BTF_TYPE_COUNT={type_count}")
          print(f"BTF_STRUCT_COUNT={struct_count}")
          print(f"BTF_UNIQUE_NAMED_STRUCTS={unique_struct_names}")
          print(f"BTF_DUPLICATE_STRUCT_RECORDS={duplicate_struct_records}")
          print(f"MAX_BTF_TYPES={max_types}")
          print("")

          print("=== BTF KIND COUNTS ===")
          for kind in sorted(kind_counts):
              print(
                  f"KIND {kind:2d} "
                  f"{kind_names.get(kind, 'UNKNOWN'):10s} "
                  f"COUNT={kind_counts[kind]}"
              )
          print("")

          print("=== TOP 40 DUPLICATED STRUCT NAMES ===")
          duplicates = [
              (name, count)
              for name, count in struct_names.items()
              if count > 1
          ]
          duplicates.sort(key=lambda item: (-item[1], item[0]))

          for name, count in duplicates[:40]:
              print(f"STRUCT_DUP name={name} count={count}")
          print("")

          print("=== TARGET TYPES ===")
          for name in sorted(targets):
              hits = target_hits.get(name, [])
              if not hits:
                  print(f"TARGET_MISSING name={name}")
                  continue

              for tid, kind, size_type, vlen, kflag in hits:
                  print(
                      f"TARGET name={name} id={tid} "
                      f"kind={kind_names.get(kind, kind)} "
                      f"kind_id={kind} size_or_type={size_type} "
                      f"vlen={vlen} kflag={kflag}"
                  )
          print("")

          if type_count > max_types:
              print("BTF_TYPE_LIMIT_EXCEEDED=YES")
              print("BTF_ANALYSIS_OK=YES")
              raise SystemExit(42)

          print("BTF_TYPE_LIMIT_EXCEEDED=NO")
          print("BTF_ANALYSIS_OK=YES")
          PY

          BTF_ANALYSIS_STATUS=$?

          set -e

          echo "=== Deep BTF analysis ==="
          cat "$BTF_DEEP_FILE"

          # ============================================================
          # Compose one concise sanity report.
          # ============================================================

          {
            echo "PAHOLE_PATH=$PAHOLE_BIN"
            echo "PAHOLE_VERSION=$PAHOLE_VERSION"
            echo "MAKEFLAGS=${MAKEFLAGS:-<unset>}"
            echo "IMAGE_BYTES=$IMAGE_SIZE"
            echo "IMAGE_MIB=$IMAGE_MIB"
            echo "MAX_IMAGE_BYTES=$MAX_IMAGE_SIZE"
            echo "BTF_BYTES=$BTF_SIZE"
            echo "BTF_MIB=$BTF_MIB"
            echo "MAX_BTF_BYTES=$MAX_BTF_SIZE"
            echo "MAX_BTF_TYPES=$MAX_BTF_TYPES"

            if [ -f "$PAHOLE_RUNTIME_FILE" ]; then
              echo ""
              echo "=== PAHOLE RUNTIME ==="
              cat "$PAHOLE_RUNTIME_FILE"
            fi

            echo ""
            grep -E \
              '^(BTF_TYPE_COUNT|BTF_STRUCT_COUNT|BTF_UNIQUE_NAMED_STRUCTS|BTF_DUPLICATE_STRUCT_RECORDS|BTF_TYPE_LIMIT_EXCEEDED|BTF_ANALYSIS_OK)=' \
              "$BTF_DEEP_FILE" \
              || true
          } > "$BTF_SANITY_FILE"

          # ============================================================
          # FINAL gate — only now may the workflow fail.
          # ============================================================

          SANITY_STATUS=0

          if [ "$BTF_ANALYSIS_STATUS" -ne 0 ]; then
            SANITY_STATUS="$BTF_ANALYSIS_STATUS"
          fi

          if [ "$BTF_SIZE" -gt "$MAX_BTF_SIZE" ]; then
            echo "BTF_SIZE_LIMIT_EXCEEDED=YES" >> "$BTF_SANITY_FILE"

            if [ "$SANITY_STATUS" -eq 0 ]; then
              SANITY_STATUS=43
            fi
          else
            echo "BTF_SIZE_LIMIT_EXCEEDED=NO" >> "$BTF_SANITY_FILE"
          fi

          if [ "$IMAGE_SIZE" -gt "$MAX_IMAGE_SIZE" ]; then
            echo "IMAGE_SIZE_LIMIT_EXCEEDED=YES" >> "$BTF_SANITY_FILE"

            if [ "$SANITY_STATUS" -eq 0 ]; then
              SANITY_STATUS=44
            fi
          else
            echo "IMAGE_SIZE_LIMIT_EXCEEDED=NO" >> "$BTF_SANITY_FILE"
          fi

          if [ "$SANITY_STATUS" -eq 0 ]; then
            echo "BTF_SANITY_OK=YES" >> "$BTF_SANITY_FILE"
          else
            echo "BTF_SANITY_OK=NO" >> "$BTF_SANITY_FILE"
          fi

          echo "=== Final BTF / Image sanity report ==="
          cat "$BTF_SANITY_FILE"

          if [ "$SANITY_STATUS" -ne 0 ]; then

            echo ""
            echo "❌ Final BTF / Image sanity check failed"

            case "$SANITY_STATUS" in
              42)
                echo "❌ BTF type count 超过 $MAX_BTF_TYPES"
                ;;
              43)
                echo "❌ .BTF 大于 64 MiB"
                ;;
              44)
                echo "❌ Image 大于 128 MiB"
                ;;
              *)
                echo "❌ BTF parser / diagnostic failed: $SANITY_STATUS"
                ;;
            esac

            echo "❌ 拒绝进入 AnyKernel3，避免再次刷入异常镜像"

            exit "$SANITY_STATUS"

          fi

          echo "✅ Final BTF / Image sanity check passed"

          rm -f "$FINAL_BTF_CHECK"
          rm -f "$BTF_OBJECT_RAW"
          rm -f "$IMAGE_SANITY_UNPACKED"

          echo ""

          echo "✅ 内核编译成功"

          echo "=== Final artifacts ==="

          find \
            ./kernel_platform/out \
            -type f \
            \( \
              -name Image \
              -o \
              -name Image.lz4 \
              -o \
              -name vmlinux \
            \) \
            -print \
            2>/dev/null \
            || true

      - name: Show Kernel Build Error
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/kernel-build.log"

          STATUS_FILE="$GITHUB_WORKSPACE/kernel-build-status.txt"

          RESOLVE_BTFIDS_PATCH_FILE="$GITHUB_WORKSPACE/resolve-btfids-patch.txt"

          RESOLVE_BTFIDS_DEBUG_FILE="$GITHUB_WORKSPACE/resolve-btfids-debug.txt"

          BTF_ID_SYMBOLS_FILE="$GITHUB_WORKSPACE/btf-id-symbols.txt"

          BTF_HELPER_TYPES_FILE="$GITHUB_WORKSPACE/btf-helper-types.txt"

          BTF_SANITY_FILE="$GITHUB_WORKSPACE/btf-sanity.txt"

          echo "============================================================"

          echo "Kernel Build Diagnostic"

          echo "============================================================"

          # ============================================================
          # Status
          # ============================================================

          if [ -f "$STATUS_FILE" ]; then

            echo ""

            echo "=== Build script exit code ==="

            cat "$STATUS_FILE"

          fi

          # ============================================================
          # Patch diagnostics may exist even if build never started
          # ============================================================

          if [ -f "$RESOLVE_BTFIDS_PATCH_FILE" ]; then

            echo ""

            echo "================ resolve_btfids patch ================="

            cat "$RESOLVE_BTFIDS_PATCH_FILE" \
              || true

          fi

          if [ ! -f "$LOG" ]; then

            echo ""

            echo "⚠️ kernel-build.log 不存在"

            echo "如果 Fallback 在编译前失败，请查看上面的 patch 输出。"

            exit 0

          fi

          # ============================================================
          # BTFDBG
          # ============================================================

          echo ""

          echo "================ BTFDBG ================="

          grep -n \
            'BTFDBG' \
            "$LOG" \
            | tail -n 400 \
            || true

          # ============================================================
          # Resolver rebuild
          # ============================================================

          echo ""

          echo "================ resolve_btfids rebuild ================="

          grep -nEi \
            'HOSTCC.*resolve_btfids|HOSTCC.*main\.o|HOSTLD.*resolve_btfids|resolve_btfids' \
            "$LOG" \
            | tail -n 500 \
            || true

          # ============================================================
          # BTFIDS runtime
          # ============================================================

          echo ""

          echo "================ BTFIDS runtime ================="

          grep -nEi \
            'LD +\.tmp_vmlinux\.btf|BTF +\.btf\.vmlinux\.bin\.o|LD +vmlinux|BTFIDS +vmlinux|SAVEBTF|BTFDBG|FAILED unresolved symbol|SORTTAB|SYSMAP|OBJCOPY|Image' \
            "$LOG" \
            | tail -n 800 \
            || true

          # ============================================================
          # SAVEBTF context
          # ============================================================

          echo ""

          echo "================ SAVEBTF context ================="

          grep -n \
            -B 80 \
            -A 120 \
            'SAVEBTF' \
            "$LOG" \
            | tail -n 600 \
            || true

          # ============================================================
          # unresolved
          # ============================================================

          echo ""

          echo "================ unresolved symbols ================="

          grep -n \
            'FAILED unresolved symbol' \
            "$LOG" \
            | tail -n 300 \
            || true

          # ============================================================
          # netlink_sock
          # ============================================================

          echo ""

          echo "================ netlink_sock ================="

          grep -nEi \
            'netlink_sock' \
            "$LOG" \
            | tail -n 500 \
            || true

          # ============================================================
          # tcp6_sock
          # ============================================================

          echo ""

          echo "================ tcp6_sock ================="

          grep -nEi \
            'tcp6_sock' \
            "$LOG" \
            | tail -n 400 \
            || true

          # ============================================================
          # BTF stages / pahole
          # ============================================================

          echo ""

          echo "================ BTF / pahole ================="

          grep -nEi \
            'BTFIDS|BTF |pahole|resolve_btfids|tag__recode_dwarf_type|ftype__recode_dwarf_types|lexblock__recode_dwarf_types|malformed BTF|unresolved symbol' \
            "$LOG" \
            | tail -n 900 \
            || true

          # ============================================================
          # Actual errors
          # ============================================================

          echo ""

          echo "================ compiler / build errors ================="

          grep -nEi \
            '(^|[^a-z])error:|fatal:|undefined reference|make(\[[0-9]+\])?: \*\*\*|FAILED|Segmentation fault|Killed|syntax error|unexpected end of file|not found' \
            "$LOG" \
            | tail -n 900 \
            || true

          # ============================================================
          # resolve_btfids source/binary
          # ============================================================

          if [ -f "$RESOLVE_BTFIDS_DEBUG_FILE" ]; then

            echo ""

            echo "================ resolve_btfids debug ================="

            tail -n 2600 \
              "$RESOLVE_BTFIDS_DEBUG_FILE" \
              || true

          fi

          # ============================================================
          # BTF ID symbols
          # ============================================================

          if [ -f "$BTF_ID_SYMBOLS_FILE" ]; then

            echo ""

            echo "================ __BTF_ID__ symbols ================="

            cat "$BTF_ID_SYMBOLS_FILE" \
              || true

          fi

          # ============================================================
          # Helper types
          # ============================================================

          if [ -f "$BTF_HELPER_TYPES_FILE" ]; then

            echo ""

            echo "================ helper DWARF ================="

            tail -n 1400 \
              "$BTF_HELPER_TYPES_FILE" \
              || true

          fi

          # ============================================================
          # Runtime pahole diagnostic
          # ============================================================

          PAHOLE_RUNTIME_FILE="$GITHUB_WORKSPACE/pahole-runtime.txt"
          BTF_DEEP_FILE="$GITHUB_WORKSPACE/btf-deep-analysis.txt"

          if [ -f "$PAHOLE_RUNTIME_FILE" ]; then

            echo ""
            echo "================ pahole runtime ================="

            cat "$PAHOLE_RUNTIME_FILE" \
              || true

          fi

          if [ -f "$BTF_DEEP_FILE" ]; then

            echo ""
            echo "================ deep BTF analysis ================="

            cat "$BTF_DEEP_FILE" \
              || true

          fi

          # ============================================================
          # Final BTF / Image sanity report
          # ============================================================

          if [ -f "$BTF_SANITY_FILE" ]; then

            echo ""
            echo "================ BTF / Image sanity ================="

            cat "$BTF_SANITY_FILE" \
              || true

          fi

          # ============================================================
          # End of full build log
          # ============================================================

          echo ""

          echo "================ 最后 1400 行 ================="

          tail -n 1400 \
            "$LOG" \
            || true

      - name: Upload Kernel Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: |
            kernel-build.log
            kernel-build-status.txt

            resolve-btfids-patch.txt
            resolve-btfids-debug.txt

            btf-id-symbols.txt

            btf-helper-types.txt
            btf-helper-dwarf.txt

            btf-sanity.txt
            btf-deep-analysis.txt
            pahole-runtime.txt

            vmlinux-before-btfids
            btf-bin-before-btfids.o
            tmp-vmlinux-btf-before-btfids
          if-no-files-found: ignore

      - name: Make AnyKernel3
        run: |
          set -e

          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          OUT_DIR="kernel_workspace/kernel_platform/out/Final-Image-Find"
          mkdir -p "$OUT_DIR"

          BTF_SANITY_FILE="$GITHUB_WORKSPACE/btf-sanity.txt"
          MAX_IMAGE_SIZE=$((128 * 1024 * 1024))

          echo "=== BTF sanity marker before AnyKernel3 ==="

          if [ -f "$BTF_SANITY_FILE" ]; then
            cat "$BTF_SANITY_FILE"

            if ! grep -q '^BTF_SANITY_OK=YES$' \
              "$BTF_SANITY_FILE"; then

              echo "❌ BTF sanity 没有通过，拒绝制作 AnyKernel3"
              exit 1
            fi
          else
            echo "⚠️ btf-sanity.txt 不存在"
            echo "⚠️ 将继续依赖下面的 Image 尺寸保护"
          fi

          echo "=== 查找目标 GKI 裸 Image ==="

          image_path=$(find \
            ./kernel_workspace/kernel_platform/out \
            -type f \
            -path '*/gki_kernel/common/arch/arm64/boot/Image' \
            2>/dev/null \
            | head -n 1)

          if [ -z "$image_path" ]; then
            image_path=$(find \
              ./kernel_workspace/kernel_platform/out \
              -type f \
              -name Image \
              2>/dev/null \
              | head -n 1)
          fi

          if [ -n "$image_path" ] && \
             [ -f "$image_path" ]; then

            echo "✅ 找到 Image: $image_path"

            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" "$OUT_DIR/Image"

          else

            echo "=== 未找到裸 Image，继续查找目标 Image.lz4 ==="

            image_lz4=$(find \
              ./kernel_workspace/kernel_platform/out \
              -type f \
              -path '*/gki_kernel/common/arch/arm64/boot/Image.lz4' \
              2>/dev/null \
              | head -n 1)

            if [ -z "$image_lz4" ]; then
              image_lz4=$(find \
                ./kernel_workspace/kernel_platform/out \
                -type f \
                -name Image.lz4 \
                2>/dev/null \
                | head -n 1)
            fi

            if [ -n "$image_lz4" ] && \
               [ -f "$image_lz4" ]; then

              echo "✅ 找到 Image.lz4: $image_lz4"

              lz4 -d -f \
                "$image_lz4" \
                ./AnyKernel3/Image

              cp ./AnyKernel3/Image "$OUT_DIR/Image"

              echo "✅ Image.lz4 已解压为 Image"

            else

              echo "❌ Image 和 Image.lz4 都没有找到"

              echo "=== 输出可能相关的文件 ==="

              find ./kernel_workspace/kernel_platform/out \
                -type f \
                \( -name 'Image*' -o -name 'vmlinux*' \) \
                -print \
                2>/dev/null \
                | head -100

              exit 1

            fi

          fi

          echo "=== 最终 AnyKernel3/Image ==="

          ls -lh ./AnyKernel3/Image

          FINAL_IMAGE_SIZE=$(stat -c '%s' ./AnyKernel3/Image)

          FINAL_IMAGE_MIB=$(python3 - "$FINAL_IMAGE_SIZE" <<'PY'
          import sys
          print(f"{int(sys.argv[1]) / 1024 / 1024:.2f}")
          PY
          )

          echo "AnyKernel3 Image bytes = $FINAL_IMAGE_SIZE"
          echo "AnyKernel3 Image MiB   = $FINAL_IMAGE_MIB"

          if [ "$FINAL_IMAGE_SIZE" -gt "$MAX_IMAGE_SIZE" ]; then

            echo "❌ AnyKernel3/Image 大于 128 MiB"
            echo "❌ 拒绝继续，防止再次刷入巨型 Image 导致无限重启"

            exit 44

          fi

          echo "✅ AnyKernel3 Image size sanity passed"

      - name: Apply KPX and Replace Image
        if: ${{ github.event.inputs.KPM != 'N/A' }}
        run: |
          set -e

          KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
          # KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpm"
          KPN_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpn"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"

          MAX_IMAGE_SIZE=$((128 * 1024 * 1024))

          cd "${OUT_DIR}"

          if [ ! -f ./Image ]; then
            echo "❌ KPM/KPN 前找不到 Image"
            exit 1
          fi

          echo "=== Image before KPM/KPN ==="
          ls -lh ./Image

          if [ "${{ github.event.inputs.KPM }}" = "KPM" ]; then

            cp "${KPM_DIR}/patch_linux" .
            chmod +x patch_linux
            ./patch_linux

          else

            cp "${KPN_DIR}/kptools-linux" "${KPN_DIR}/kpimg-linux" .
            chmod +x ./kptools-linux

            ./kptools-linux \
              -p \
              -i ./Image \
              -k ./kpimg-linux \
              -o ./oImage

          fi

          if [ ! -f ./oImage ]; then
            echo "❌ KPM/KPN 没有生成 oImage"
            exit 1
          fi

          PATCHED_IMAGE_SIZE=$(stat -c '%s' ./oImage)

          PATCHED_IMAGE_MIB=$(python3 - "$PATCHED_IMAGE_SIZE" <<'PY'
          import sys
          print(f"{int(sys.argv[1]) / 1024 / 1024:.2f}")
          PY
          )

          echo "=== Patched Image ==="
          echo "bytes = $PATCHED_IMAGE_SIZE"
          echo "MiB   = $PATCHED_IMAGE_MIB"

          if [ "$PATCHED_IMAGE_SIZE" -gt "$MAX_IMAGE_SIZE" ]; then

            echo "❌ KPM/KPN 后 Image 大于 128 MiB"
            echo "❌ 拒绝复制进 AnyKernel3"

            exit 44

          fi

          mv -f oImage Image

          cp Image \
            "${GITHUB_WORKSPACE}/AnyKernel3/Image"

          echo "✅ KPM/KPN Image size sanity passed"
          ls -lh "${GITHUB_WORKSPACE}/AnyKernel3/Image"

      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success&event=push" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
          else
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$ARTIFACT_URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            else
              echo "Failed to fetch artifact URL"
            fi
          fi

      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          wget -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: Download Latest SukiSU-Ultra APK from CI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANAGER_ARTIFACT=manager

          echo "Using branch: $KSU_MANAGER_BRANCH"
          echo "Downloading artifact: $MANAGER_ARTIFACT"

          run_id=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=$KSU_MANAGER_BRANCH&status=success&event=push&per_page=1" --jq '.workflow_runs[0].id' || echo "")

          if [[ -z "$run_id" ]]; then
            echo "No successful workflow run found on branch $KSU_MANAGER_BRANCH. Skipping download."
            exit 0
          fi
          artifact_url=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$run_id/artifacts" | jq -r ".artifacts[] | select(.name == \"$MANAGER_ARTIFACT\") | .archive_download_url" | head -n1)

          if [[ -z "$artifact_url" ]]; then
            echo "No artifact '$MANAGER_ARTIFACT' found in run $run_id. Skipping download."
            exit 0
          fi
          echo "Downloading from: $artifact_url"
          curl -fL -H "Authorization: token $GITHUB_TOKEN" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url"
          unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d ./AnyKernel3/

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ env.ZRAM_ALGO_U && format('_{0}', env.ZRAM_ALGO_U) || '' }}${{ github.event.inputs.KPM == 'KPM' && '_KPM' || github.event.inputs.KPM == 'KPN' && '_KPN' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && '_BBG' || '' }}_ILH${{ github.event.inputs.SCHED_HMBIRD== 'true' && '_HMBIRD' || '' }}${{ github.event.inputs.DROID_SPACES== 'true' && '_DS' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && '_REKER' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && '_LZ4UPD' || '' }}" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}(${{ env.CKERNEL_VERSION }})${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*

      - name: Extract and Process ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/')
        id: zram_find
        run: |
          set -e
          ZRAM_ZIP="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/ZRAM.zip"

          if [ ! -f "$ZRAM_ZIP" ]; then
            echo "❌ 未找到 ZRAM.zip: $ZRAM_ZIP"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unzip "$ZRAM_ZIP" -d ZRAM-Module

          CONFIG_PROP="ZRAM-Module/config.prop"
          if [ -f "$CONFIG_PROP" ]; then
            echo "修改 config.prop"
            sed -i "s/^ZRAM_ALGO=.*/ZRAM_ALGO=${ZRAM_ALGO}/" "$CONFIG_PROP"
            sed -i "s/^ZRAM_SIZE=.*/ZRAM_SIZE=${ZRAM_SIZE}/" "$CONFIG_PROP"
            echo "ZRAM_ALGO=${ZRAM_ALGO}"
            echo "ZRAM_SIZE=${ZRAM_SIZE}"
          else
            echo "❌ 未找到 config.prop"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target="./ZRAM-Module/zram/zram.ko"
          echo "查找 zram.ko 模块文件..."
          search_paths=(
            "./kernel_workspace/kernel_platform/out"
            "./kernel_workspace/device/qcom"
          )
          zram_path=""
          for path in "${search_paths[@]}"; do
            if [ -d "$path" ]; then
              zram_path=$(find "$path" -type f -name "zram.ko" | head -n 1)
              [ -n "$zram_path" ] && break
            fi
          done
          if [ -z "$zram_path" ]; then
            zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" | head -n 1)
          fi
          if [ -n "$zram_path" ] && [ -f "$zram_path" ]; then
            echo "✅ zram.ko file finally located at: $zram_path"
            install -D "$zram_path" "$target"
          else
            echo "❌ 未找到 zram.ko 文件，可能是未支持的内核版本或构建失败"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Upload ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/') && steps.zram_find.outputs.upload != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
          path: ZRAM-Module/*

      - name: Check Cache Size Before Save
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: cache_size_check
        run: |
          check_size() {
            local CACHE_DIR="$1"
            local CACHE_NAME="$2"
            if [[ ! -d "$CACHE_DIR" ]]; then
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
              return
            fi
            SIZE_MB=$(du -sm "$CACHE_DIR" | cut -f1)
            echo "$CACHE_DIR 大小: ${SIZE_MB}MB"
            if (( SIZE_MB >= 5 )); then
              echo "${CACHE_NAME}_save=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Cache Warning::$CACHE_NAME 小于 5MB，跳过保存"
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_size "${{ env.CCACHE_DIR }}" "ccache"
          check_size "${{ github.workspace }}/kernel_workspace/.thinlto-cache" "thinlto"

      - name: Save Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && steps.cache_size_check.outputs.ccache_save == 'true' && steps.restore-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.8

      - name: Save ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' && steps.cache_size_check.outputs.thinlto_save == 'true' && steps.restore-thinlto.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-16.8

      - name: Post-build Disk Check
        run: df -h
